<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Taller | Diemar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161a'/%3E%3Crect x='12' y='7' width='8' height='18' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --plane:#08090b; --surface-1:#12161a; --surface-2:#171c21; --surface-3:#1d2329;
    --hairline:rgba(255,255,255,.07); --hairline-2:rgba(255,255,255,.13);
    --ink:#e9ecef; --ink-2:#a9b0b8; --ink-muted:#7b828b;
    --brand:#ff7a1a; --brand-soft:rgba(255,122,26,.12);
    --ok:#31bd65; --warn:#f0b429; --bad:#e35d62;
    --barra:56px; --lado:236px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--plane); color:var(--ink); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* ---------------------------------------------------------------- barra */
  .barra{height:var(--barra);display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--surface-1);border-bottom:1px solid var(--hairline)}
  .barra img{height:24px}
  .barra .t{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:700}
  .barra .quien{margin-left:auto;display:flex;align-items:center;gap:12px;
    font-size:12.5px;color:var(--ink-2);min-width:0}
  .barra .quien .rol,.barra .quien a{flex:none}
  .barra .quien .nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barra .quien a{color:var(--ink-muted);text-decoration:none;font-size:11.5px}
  .barra .quien a:hover{color:var(--brand)}
  .rol{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;
    color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:3px 8px}

  /* ------------------------------------------------------------ el armado */
  /* Navegación al costado y la foto ocupando todo lo que queda: la app se
     usa desde acá, no se lee como una página. */
  .todo{display:grid;grid-template-columns:var(--lado) 1fr;height:calc(100% - var(--barra))}

  .lado{background:var(--surface-1);border-right:1px solid var(--hairline);
    padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
  .lado .rot{padding:6px 10px 8px;font-size:10px;font-weight:800;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--ink-muted)}
  .nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    text-decoration:none;color:var(--ink-2);transition:background .14s,color .14s}
  .nav:hover{background:var(--surface-3);color:var(--ink)}
  .nav:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .nav svg{width:19px;height:19px;flex:none;color:var(--ink-muted)}
  .nav:hover svg{color:var(--brand)}
  .nav b{font-weight:600;font-size:14px;flex:1;min-width:0}
  /* La chapita es el estado del módulo: solo aparece si hay algo que mirar. */
  /* Vacía no se dibuja: si no hay nada que avisar, no hay chapita. */
  .chapa:empty{display:none}
  .chapa{font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 7px;
    background:var(--surface-3);color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .chapa.mal{color:#ffb3b6;background:rgba(227,93,98,.16)}
  .chapa.ojo{color:#ffd98a;background:rgba(240,180,41,.14)}
  .lado .abajo{margin-top:auto;padding:10px 12px 2px;font-size:11px;
    color:var(--ink-muted);border-top:1px solid var(--hairline)}

  /* ---------------------------------------------------------------- foto */
  .vista{position:relative;overflow:hidden;background:#0c0f12}
  /* La foto es 3:2 y el hueco en una pantalla ancha queda parecido, así que
     entra casi sin recorte. */
  .vista .foto{position:absolute;inset:0;
    background:url('/inicio-camion.jpg') center center/cover no-repeat}
  .vista::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,9,11,.3) 0%,transparent 16%,
      transparent 44%,rgba(8,9,11,.55) 74%,rgba(8,9,11,.88) 100%)}

  .encima{position:absolute;z-index:2;left:0;right:0;bottom:0;
    padding:22px clamp(18px,3vw,34px)}
  .saludo{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;
    text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .saludo b{font-size:clamp(19px,2.2vw,26px);font-weight:700;letter-spacing:-.02em}
  .saludo span{font-size:12.5px;color:rgba(233,236,239,.7)}

  /* ---------------------------------------------------------------- cifras */
  .cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cifra{display:flex;flex-direction:column;justify-content:center;
    padding:14px 16px;border-radius:14px;text-decoration:none;color:inherit;
    background:rgba(18,22,26,.72);backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--hairline-2);transition:background .16s,border-color .16s}
  a.cifra:hover{background:rgba(29,35,41,.86);border-color:rgba(255,122,26,.4)}
  .cifra .n{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.03em;
    line-height:1;font-variant-numeric:tabular-nums}
  .cifra .n.mal{color:var(--bad)} .cifra .n.ojo{color:var(--warn)}
  .cifra .n.bien{color:var(--ok)}
  .cifra .n.cargando{color:var(--ink-muted);font-weight:400}
  .cifra .q{margin-top:6px;font-size:10px;font-weight:700;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--ink-2)}
  .cifra .pie{margin-top:2px;font-size:11px;color:var(--ink-muted)}

  /* ----------------------------------------------------------- en celular */
  /* Los módulos pasan a una tira arriba, que en un teléfono se llega con el
     pulgar y no se come media pantalla como una lista de tarjetas. */
  @media (max-width:820px){
    body{overflow:auto}
    .barra{padding:0 14px;gap:10px}
    .barra .t{display:none}
    .todo{display:block;height:auto}
    .lado{flex-direction:row;gap:8px;overflow-x:auto;padding:10px 12px;
      border-right:0;border-bottom:1px solid var(--hairline);
      position:sticky;top:0;z-index:4;scrollbar-width:none}
    .lado::-webkit-scrollbar{display:none}
    .lado .rot,.lado .abajo{display:none}
    .nav{flex:none;padding:9px 13px;background:var(--surface-2);white-space:nowrap}
    .nav b{font-size:13px}
    /* La foto toma lo que queda de pantalla, así no aparece un hueco negro
       abajo de las cifras. dvh cuenta la barra del navegador del celular,
       que aparece y desaparece al desplazarse. */
    .vista{height:calc(100dvh - var(--barra) - 61px);min-height:440px}
    /* En vertical se recorta mucho de los costados: se corre al camión para
       no quedarse con el pasto, y un poco arriba para que la trompa no
       termine tapada por las cifras. */
    .vista .foto{background-position:62% 34%}
    .encima{padding:16px 14px}
    /* El saludo y la fecha en dos renglones: en un teléfono lado a lado se
       parten por la mitad las dos cosas. */
    .saludo{flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:12px}
    .cifras{grid-template-columns:repeat(2,1fr);gap:8px}
    .cifra{padding:12px 13px}
  }
</style>
</head>
<body>

<div class="barra">
  <img src="/logo.png" alt="Diemar" onerror="this.style.display='none'">
  <span class="t">App Taller</span>
  <span class="quien" id="quien"></span>
</div>

<div class="todo">

  <nav class="lado">
    <span class="rot">Módulos</span>

    <a class="nav" href="/gomeria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/>
      </svg>
      <b>Gomería</b><span class="chapa" data-c="gomeria"></span>
    </a>

    <a class="nav" href="/repuestos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
      </svg>
      <b>Repuestos</b><span class="chapa" data-c="repuestos"></span>
    </a>

    <a class="nav" href="/vencimientos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/>
        <path d="M8 3v4"/><path d="M16 3v4"/>
      </svg>
      <b>Vencimientos</b><span class="chapa" data-c="vencimientos"></span>
    </a>

    <a class="nav" href="/flota">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19V6"/><path d="M4 15l5-4 4 3 7-6"/>
      </svg>
      <b>Panel de flota</b>
    </a>

    <a class="nav" href="/control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17V7a1 1 0 0 1 1-1h10v11H3z"/><path d="M14 10h4l3 3v4h-7z"/>
        <circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>
      </svg>
      <b>Control de flota</b>
    </a>

    <span class="abajo" id="abajo"></span>
  </nav>

  <main class="vista">
    <div class="foto" role="img" aria-label="Camión de Expreso Diemar en ruta"></div>
    <div class="encima">
      <p class="saludo"><b id="saludo">Hola</b><span id="fecha"></span></p>
      <div class="cifras">
        <a class="cifra" href="/vencimientos">
          <span class="n cargando" data-n="vencidos">·</span>
          <span class="q">Documentos vencidos</span>
          <span class="pie" data-p="vencidos"></span>
        </a>
        <a class="cifra" href="/gomeria">
          <span class="n cargando" data-n="montadas">·</span>
          <span class="q">Cubiertas montadas</span>
          <span class="pie" data-p="montadas"></span>
        </a>
        <a class="cifra" href="/repuestos">
          <span class="n cargando" data-n="reponer">·</span>
          <span class="q">Repuestos a reponer</span>
          <span class="pie" data-p="reponer"></span>
        </a>
        <a class="cifra" href="/control">
          <span class="n cargando" data-n="km">·</span>
          <span class="q">Unidades al día</span>
          <span class="pie" data-p="km">Kilometraje del satelital</span>
        </a>
      </div>
    </div>
  </main>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mil = n => Number(n).toLocaleString('es-AR');

const hoy = new Date();
$('#fecha').textContent = hoy.toLocaleDateString('es-AR',
  {weekday:'long', day:'numeric', month:'long'});

fetch('/api/yo').then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return;
  $('#quien').innerHTML =
    `<span class="rol">${esc(d.rol)}</span><span class="nom">${esc(d.nombre)}</span>` +
    `<a href="/salir">Salir</a>`;
  // El nombre de pila alcanza: es la app del taller, no un trámite.
  const h = hoy.getHours();
  const momento = h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  $('#saludo').textContent = `${momento}, ${String(d.nombre).split(' ')[0]}`;
}).catch(() => {});

/** Sin dato queda un guion, no un cero: un cero se leería como "no hay
    ninguno" cuando en realidad todavía no se sabe. */
function cifra(clave, valor, tono, pie) {
  const n = document.querySelector(`[data-n="${clave}"]`);
  const p = document.querySelector(`[data-p="${clave}"]`);
  if (!n) return;
  n.classList.remove('cargando');
  if (valor === null || valor === undefined) {
    n.textContent = '—';
    n.classList.add('cargando');
    if (p) p.textContent = 'sin cargar todavía';
    return;
  }
  n.textContent = mil(valor);
  if (tono) n.classList.add(tono);
  if (p && pie) p.textContent = pie;
}

/** La chapita del costado solo aparece cuando hay algo que mirar. */
function chapa(clave, texto, tono) {
  const e = document.querySelector(`[data-c="${clave}"]`);
  if (!e || !texto) return;
  e.textContent = texto;
  if (tono) e.classList.add(tono);
}

function cuando(iso) {
  if (!iso) return '';
  const f = new Date(iso + 'T00:00:00');
  const dias = Math.round((new Date().setHours(0,0,0,0) - f) / 86400000);
  if (dias <= 0) return 'hoy';
  if (dias === 1) return 'ayer';
  if (dias < 7) return `hace ${dias} días`;
  return f.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
}

fetch('/api/inicio').then(r => r.ok ? r.json() : null).then(d => {
  if (!d) throw new Error('sin resumen');

  cifra('vencidos', d.vencidos, d.vencidos > 0 ? 'mal' : 'bien',
    d.por_vencer ? `${mil(d.por_vencer)} por vencer` :
    (d.controlados ? `${mil(d.controlados)} controlados` : ''));
  cifra('montadas', d.montadas, null,
    d.en_stock != null ? `${mil(d.en_stock)} en stock` : '');
  cifra('reponer', d.reponer, d.reponer > 0 ? 'ojo' : 'bien',
    d.articulos != null ? `de ${mil(d.articulos)} artículos` : '');
  cifra('km', d.km_unidades, null,
    d.km_fecha ? `Satelital · ${cuando(d.km_fecha)}` : 'Kilometraje del satelital');

  if (d.vencidos) chapa('vencimientos', d.vencidos, 'mal');
  if (d.reponer) chapa('repuestos', d.reponer, 'ojo');
  if (d.unidades) chapa('gomeria', d.unidades);

  if (d.unidades != null)
    $('#abajo').textContent = `${mil(d.unidades)} unidades activas` +
      (d.km_fecha ? ` · odómetros de ${cuando(d.km_fecha)}` : '');
}).catch(() => {
  document.querySelectorAll('.cifra .n').forEach(n => {
    n.textContent = '—';
    n.classList.add('cargando');
  });
});
</script>
</body>
</html>
