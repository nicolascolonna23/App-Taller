<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultas | Diemar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161a'/%3E%3Crect x='12' y='7' width='8' height='18' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que el panel de flota. */
  :root{
    color-scheme: dark;
    --plane:#08090b; --surface-1:#12161a; --surface-2:#171c21; --surface-3:#1d2329;
    --hairline:rgba(255,255,255,.07); --hairline-2:rgba(255,255,255,.12);
    --ink:#e9ecef; --ink-2:#a9b0b8; --ink-muted:#7b828b;
    --brand:#ff7a1a; --brand-soft:rgba(255,122,26,.12);
    --st-good:#0ca30c; --st-warning:#fab219; --st-critical:#d03b3b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;max-width:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--plane); color:var(--ink); font-size:14.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  }

  /* ---------- barra superior ---------- */
  .topbar{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 22px; border-bottom:1px solid var(--hairline);
    background:var(--surface-1); position:relative; flex:none;
  }
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--brand),rgba(255,122,26,0) 55%)}
  .logo{height:34px;width:auto}
  .brandblock{display:flex;flex-direction:column;gap:2px;margin-right:auto}
  .brandblock h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .brandblock .sub{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:500}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);
    border:1px solid var(--hairline);border-radius:999px;padding:6px 12px;
    font-weight:500;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-muted);flex:none}
  .dot.ok{background:var(--st-good)}
  .dot.mal{background:var(--st-critical)}

  /* ---------- conversación ---------- */
  .hilo{flex:1;overflow-y:auto;padding:26px 22px 8px}
  .hilo-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

  .msg{display:flex;gap:13px;align-items:flex-start}
  .msg .avatar{
    width:29px;height:29px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;letter-spacing:.5px;margin-top:1px;
  }
  .msg.yo .avatar{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--hairline)}
  .msg.bot .avatar{background:var(--brand-soft);color:var(--brand);border:1px solid rgba(255,122,26,.3)}
  .burbuja{min-width:0;flex:1}
  .msg.yo .burbuja{color:var(--ink)}
  .quien{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:600;margin-bottom:5px}

  /* ---------- markdown de la respuesta ---------- */
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:0 0 10px}
  .md ul,.md ol{margin:0 0 10px;padding-left:22px}
  .md li{margin:3px 0}
  .md strong{font-weight:600;color:#fff}
  .md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    background:var(--surface-3);border:1px solid var(--hairline);border-radius:5px;padding:1px 5px}
  .md h3{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-2);
    margin:16px 0 8px;font-weight:600}
  .tabla-wrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--hairline);border-radius:10px}
  .md table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  .md th{background:#0d1114;color:var(--ink-muted);font-size:10.5px;font-weight:600;
    letter-spacing:1.2px;text-transform:uppercase;padding:10px 11px;text-align:left;
    white-space:nowrap;border-bottom:1px solid var(--hairline)}
  .md td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  .md tr:last-child td{border-bottom:none}
  .md td.num,.md th.num{text-align:right}
  .md tbody tr:hover{background:rgba(255,122,26,.045)}

  /* ---------- estado mientras piensa ---------- */
  .trabajando{display:flex;flex-direction:column;gap:6px;color:var(--ink-muted);font-size:13px}
  .paso{display:flex;align-items:center;gap:9px}
  .paso .bolita{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;
    animation:latir 1.3s ease-in-out infinite}
  .paso.hecho .bolita{background:var(--ink-muted);animation:none}
  @keyframes latir{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.paso .bolita{animation:none}}

  .error{border-left:2px solid var(--st-critical);padding-left:12px;color:#f0a8a8}

  /* ---------- sugerencias ---------- */
  .bienvenida{padding:10px 0 0}
  .bienvenida h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .bienvenida p{margin:0 0 18px;color:var(--ink-muted);font-size:13.5px}
  .sugerencias{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
  .sug{text-align:left;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;
    background:var(--surface-1);border:1px solid var(--hairline);border-radius:11px;
    padding:12px 14px;transition:border-color .18s,color .18s}
  .sug:hover{color:var(--ink);border-color:rgba(255,122,26,.4)}

  /* ---------- barra de escritura ---------- */
  .abajo{flex:none;border-top:1px solid var(--hairline);background:var(--surface-1);padding:14px 22px 16px}
  .abajo-in{max-width:820px;margin:0 auto}
  .caja{display:flex;gap:10px;align-items:flex-end;background:var(--surface-2);
    border:1px solid var(--hairline-2);border-radius:13px;padding:9px 9px 9px 15px;
    transition:border-color .18s}
  .caja:focus-within{border-color:rgba(255,122,26,.5)}
  #texto{flex:1;font:inherit;color:var(--ink);background:none;border:none;outline:none;
    resize:none;max-height:180px;line-height:1.5;padding:5px 0}
  #texto::placeholder{color:var(--ink-muted)}
  #enviar{flex:none;width:35px;height:35px;border-radius:9px;border:1px solid rgba(255,122,26,.32);
    background:var(--brand-soft);color:var(--brand);cursor:pointer;display:grid;place-items:center;
    transition:background .18s}
  #enviar:hover:not(:disabled){background:rgba(255,122,26,.22)}
  #enviar:disabled{opacity:.4;cursor:default}
  #enviar svg{width:17px;height:17px}
  .pie{margin-top:9px;font-size:11px;color:var(--ink-muted);display:flex;gap:14px;flex-wrap:wrap}

  @media (max-width:640px){
    .topbar{padding:11px 14px;gap:11px}
    .hilo{padding:18px 14px 6px}
    .abajo{padding:11px 14px 13px}
    .brandblock h1{font-size:14.5px}
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="logo.png" alt="Diemar" class="logo">
  <div class="brandblock">
    <div class="sub">Expreso Diemar</div>
    <h1>Consultas de clientes y cuenta corriente</h1>
  </div>
  <span class="chip" id="chip-datos"><span class="dot"></span><span id="txt-datos">Cargando…</span></span>
</div>

<div class="hilo" id="hilo">
  <div class="hilo-in" id="conversacion">
    <div class="bienvenida">
      <h2>¿Qué necesitás saber?</h2>
      <p>Preguntá por un cliente, por deuda vencida o por la cartera entera. Consulto los reportes y te contesto con los números.</p>
      <div class="sugerencias" id="sugerencias">
        <button class="sug">¿Cuánto debe CONFECAT?</button>
        <button class="sug">Los 10 clientes con más deuda vencida</button>
        <button class="sug">¿Qué clientes se pasaron del límite de crédito?</button>
        <button class="sug">Deuda total de la cartera por empresa</button>
      </div>
    </div>
  </div>
</div>

<div class="abajo">
  <div class="abajo-in">
    <div class="caja">
      <textarea id="texto" rows="1" placeholder="Preguntá por un cliente, un saldo o la cartera…" autofocus></textarea>
      <button id="enviar" title="Enviar (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
        </svg>
      </button>
    </div>
    <div class="pie">
      <span>Enter envía · Shift+Enter hace un salto de línea</span>
      <span id="pie-fecha"></span>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const hilo = $('#hilo'), conversacion = $('#conversacion'), texto = $('#texto'), enviar = $('#enviar');

/* El historial que se le manda al servidor en cada vuelta. */
const historial = [];
let ocupado = false;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* ---------------------------------------------------------------
   Markdown mínimo: lo que realmente usa el asistente (tablas,
   negrita, listas, código). Se escapa primero, así que un nombre de
   cliente con "<" no puede meter HTML en la página.
   --------------------------------------------------------------- */
function esNumero(celda){
  return /^[$\-+]?[\d.,]+%?$/.test(celda.trim()) && /\d/.test(celda);
}

function enLinea(t){
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function md(fuente){
  const lineas = String(fuente).replace(/\r/g,'').split('\n');
  let html = '', i = 0;

  const celdas = l => l.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());

  while (i < lineas.length) {
    const l = lineas[i];

    // Tabla: encabezado + separador de guiones
    if (/^\s*\|/.test(l) && i+1 < lineas.length && /^\s*\|?[\s:-]*-[\s|:-]*$/.test(lineas[i+1])) {
      const cab = celdas(l);
      i += 2;
      const cuerpo = [];
      while (i < lineas.length && /^\s*\|/.test(lineas[i])) cuerpo.push(celdas(lineas[i++]));
      // Una columna se alinea a la derecha si sus valores son números.
      const numerica = cab.map((_,c) => cuerpo.length > 0 &&
        cuerpo.every(f => f[c] === undefined || f[c] === '' || esNumero(f[c])));
      html += '<div class="tabla-wrap"><table><thead><tr>' +
        cab.map((c,n) => `<th${numerica[n]?' class="num"':''}>${enLinea(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        cuerpo.map(f => '<tr>' + cab.map((_,n) =>
          `<td${numerica[n]?' class="num"':''}>${enLinea(f[n] || '')}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>';
      continue;
    }

    // Listas
    const vinieta = /^\s*[-*]\s+(.*)$/, numerada = /^\s*\d+[.)]\s+(.*)$/;
    if (vinieta.test(l) || numerada.test(l)) {
      const ordenada = numerada.test(l), re = ordenada ? numerada : vinieta;
      const items = [];
      while (i < lineas.length && re.test(lineas[i])) items.push(lineas[i++].match(re)[1]);
      html += `<${ordenada?'ol':'ul'}>` + items.map(t => `<li>${enLinea(t)}</li>`).join('') +
              `</${ordenada?'ol':'ul'}>`;
      continue;
    }

    // Título
    const t = l.match(/^\s*#{1,4}\s+(.*)$/);
    if (t) { html += `<h3>${enLinea(t[1])}</h3>`; i++; continue; }

    // Párrafo: junta líneas hasta el próximo renglón en blanco
    if (l.trim() === '') { i++; continue; }
    const parrafo = [];
    while (i < lineas.length && lineas[i].trim() !== '' &&
           !/^\s*\|/.test(lineas[i]) && !vinieta.test(lineas[i]) &&
           !numerada.test(lineas[i]) && !/^\s*#{1,4}\s/.test(lineas[i])) {
      parrafo.push(lineas[i++]);
    }
    html += `<p>${enLinea(parrafo.join('\n')).replace(/\n/g,'<br>')}</p>`;
  }
  return html;
}

/* --------------------------------------------------------------- */

function abajoDeTodo(){ hilo.scrollTop = hilo.scrollHeight; }

function agregarMensaje(quien, contenidoHTML){
  const bienvenida = conversacion.querySelector('.bienvenida');
  if (bienvenida) bienvenida.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (quien === 'yo' ? 'yo' : 'bot');
  div.innerHTML =
    `<div class="avatar">${quien === 'yo' ? 'VOS' : 'DM'}</div>` +
    `<div class="burbuja"><div class="quien">${quien === 'yo' ? 'Vos' : 'Asistente'}</div>` +
    `<div class="cuerpo">${contenidoHTML}</div></div>`;
  conversacion.appendChild(div);
  abajoDeTodo();
  return div.querySelector('.cuerpo');
}

async function preguntar(pregunta){
  if (ocupado || !pregunta.trim()) return;
  ocupado = true; enviar.disabled = true;

  agregarMensaje('yo', `<div class="md">${md(pregunta)}</div>`);
  historial.push({ role: 'user', content: pregunta });

  const cuerpo = agregarMensaje('bot', '<div class="trabajando"><div class="paso"><span class="bolita"></span>pensando…</div></div>');
  const trabajando = cuerpo.querySelector('.trabajando');

  function paso(txt){
    trabajando.querySelectorAll('.paso').forEach(p => p.classList.add('hecho'));
    const d = document.createElement('div');
    d.className = 'paso';
    d.innerHTML = `<span class="bolita"></span>${esc(txt)}…`;
    trabajando.appendChild(d);
    abajoDeTodo();
  }

  try{
    const r = await fetch('api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensajes: historial })
    });
    if (!r.ok) throw new Error('El servidor respondió ' + r.status);

    // Los eventos llegan de a uno mientras el asistente consulta.
    const lector = r.body.getReader(), dec = new TextDecoder();
    let buffer = '', respuesta = '';
    for(;;){
      const { done, value } = await lector.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const partes = buffer.split('\n\n');
      buffer = partes.pop();
      for (const parte of partes){
        const linea = parte.split('\n').find(x => x.startsWith('data: '));
        if (!linea) continue;
        const ev = JSON.parse(linea.slice(6));
        if (ev.tipo === 'herramienta') paso(ev.dato);
        else if (ev.tipo === 'texto'){
          respuesta = ev.dato;
          cuerpo.innerHTML = `<div class="md">${md(respuesta)}</div>`;
          abajoDeTodo();
        } else if (ev.tipo === 'error'){
          cuerpo.innerHTML = `<div class="error">${esc(ev.dato)}</div>`;
          abajoDeTodo();
        }
      }
    }
    if (respuesta) historial.push({ role: 'assistant', content: respuesta });
    else historial.pop();   // sin respuesta, la pregunta no queda en el historial
  } catch(e){
    cuerpo.innerHTML = `<div class="error">No se pudo consultar: ${esc(e.message)}</div>`;
    historial.pop();
  } finally {
    ocupado = false; enviar.disabled = false; texto.focus();
  }
}

/* ---------- eventos ---------- */
function enviarLoEscrito(){
  const t = texto.value.trim();
  if (!t) return;
  texto.value = ''; texto.style.height = 'auto';
  preguntar(t);
}
enviar.addEventListener('click', enviarLoEscrito);
texto.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarLoEscrito(); }
});
texto.addEventListener('input', () => {
  texto.style.height = 'auto';
  texto.style.height = Math.min(texto.scrollHeight, 180) + 'px';
});
document.getElementById('sugerencias')?.addEventListener('click', e => {
  const b = e.target.closest('.sug');
  if (b) preguntar(b.textContent);
});

/* Estado de la base: qué período tiene cargado la copia. */
fetch('api/estado').then(r => r.json()).then(d => {
  const chip = document.getElementById('chip-datos'), dot = chip.querySelector('.dot');
  if (d.error) {
    dot.className = 'dot mal';
    document.getElementById('txt-datos').textContent = 'Sin datos';
    return;
  }
  dot.className = 'dot ok';
  document.getElementById('txt-datos').textContent =
    `${d.clientes_en_maestro.toLocaleString('es-AR')} clientes`;
  document.getElementById('pie-fecha').textContent =
    `Datos cargados hasta ${d.hasta} · no es tiempo real`;
}).catch(() => {
  document.getElementById('txt-datos').textContent = 'Servidor sin responder';
  document.querySelector('#chip-datos .dot').className = 'dot mal';
});
</script>
</body>
</html>
