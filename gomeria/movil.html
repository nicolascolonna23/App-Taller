<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gomería | Diemar</title>
<style>
:root{color-scheme:dark;--b:#08090b;--p:#12161a;--p2:#191e23;--p3:#20262c;--l:#ffffff14;--l2:#ffffff24;--t:#edf0f2;--m:#8d959e;--o:#ff7a1a;--os:#ff7a1a20;--ok:#31bd65;--w:#f0b429;--bad:#e35d62}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Inter,system-ui,sans-serif}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--p);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:10}.top img{height:27px}.brand{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--m);font-weight:800}.who{margin-left:auto;color:var(--m);font-size:12px}.who a{color:var(--m);margin-left:10px;text-decoration:none}.tabs{display:flex;padding:8px 20px 0;background:var(--p);border-bottom:1px solid var(--l);overflow:auto}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--m);padding:11px 15px;font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}.tab.on{color:var(--t);border-color:var(--o)}main{max-width:1440px;margin:auto;padding:18px 20px}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:315px 1fr;gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px}.side{height:calc(100vh - 126px);position:sticky;top:114px;display:flex;flex-direction:column}h1,h2{margin:0}.sub{color:var(--m);margin:4px 0 14px}.search,input,select,textarea{width:100%;background:var(--p2);color:var(--t);border:1px solid var(--l2);border-radius:10px;padding:10px 12px;font:inherit;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#ff7a1a99}label{display:block;color:var(--m);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}.units{overflow:auto;margin-top:10px}.unit{width:100%;display:grid;grid-template-columns:8px 92px 1fr auto;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--l);background:none;color:var(--t);padding:11px 5px;text-align:left;cursor:pointer}.unit:hover,.unit.on{background:var(--os)}.dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--w)}.plate{font-weight:850;letter-spacing:.6px}.um{color:var(--m);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oc{color:var(--m);font-size:11px}.hero{display:flex;justify-content:space-between;gap:10px}.hero h2{font-size:26px}.meta{color:var(--m);margin-top:4px}.pill{border:1px solid var(--l2);border-radius:99px;padding:5px 9px;color:var(--m);font-size:11px;height:max-content}.map{margin-top:16px;padding:20px;background:linear-gradient(var(--p2),var(--p));border:1px solid var(--l);border-radius:13px}.ax{display:flex;align-items:center;justify-content:center;gap:7px;max-width:770px;margin:0 auto 15px}.ax:last-child{margin-bottom:0}.axn{width:25px;color:var(--m);font-size:11px;font-weight:800}.bar{height:3px;min-width:16px;max-width:180px;flex:1;background:var(--l2)}.tire{width:70px;min-height:67px;padding:7px 4px;background:var(--p3);color:var(--t);border:1px solid var(--l2);border-radius:9px;text-align:center;cursor:pointer}.tire:hover{border-color:var(--o)}.tire.empty{border-style:dashed;background:none;color:var(--m)}.tire.low{border-color:var(--bad)}.tire.mid{border-color:var(--w)}.pos{font-size:10px;font-weight:800;color:var(--m)}.code{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mm{font-size:10px;color:var(--m);margin-top:2px}.spare{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:15px;border-top:1px solid var(--l)}.spare b,.section h3{font-size:11px;color:var(--m);letter-spacing:1px;text-transform:uppercase}.section{margin-top:16px}.section h3{margin:0 0 10px}.event{display:grid;grid-template-columns:130px 90px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--l)}.event:first-child{border-top:0}.date,.note{font-size:12px;color:var(--m)}.type{font-size:10px;color:var(--o);text-transform:uppercase;font-weight:850}.note{margin-top:3px}.emptymsg,.loading{text-align:center;color:var(--m);padding:32px}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o);margin-right:8px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.2}}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.metric{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px}.metric b{display:block;font-size:24px}.metric span{color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.stockbar,.actions{display:flex;gap:8px;align-items:center}.stockbar{justify-content:space-between;margin-bottom:12px}.filters{display:flex;gap:8px;flex:1}.filters input{max-width:360px}.filters select{max-width:190px}.btn{border:0;border-radius:10px;background:var(--o);color:#fff;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.btn.alt{background:var(--p3);border:1px solid var(--l2);color:var(--t)}.btn:disabled{opacity:.45}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:10px 8px;border-bottom:1px solid var(--l2)}td{padding:11px 8px;border-bottom:1px solid var(--l)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--os)}.status{border-radius:99px;background:var(--p3);padding:4px 8px;font-size:10px;text-transform:uppercase;font-weight:850}.status.stock{color:var(--ok)}.status.montada{color:#65b6ff}.status.reparacion,.status.recapado{color:var(--w)}.status.baja{color:var(--bad)}.register{max-width:760px;margin:auto}.register textarea{min-height:120px;resize:vertical}.help{font-size:12px;color:var(--m)}.result{margin-top:14px;padding:14px;border:1px solid var(--l);border-radius:12px;background:var(--p2)}.proposal{border-color:#ff7a1a77}.error{color:#ffadb0}.success{color:#a7e8bc}.modalbg{position:fixed;inset:0;background:#000c;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modalbg.on{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--l2);border-radius:16px;padding:19px}.modaltop{display:flex;justify-content:space-between}.close{border:0;background:none;color:var(--m);font-size:25px;cursor:pointer}.details,.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.details{margin:15px 0}.detail{background:var(--p2);border-radius:9px;padding:10px}.detail span{display:block;color:var(--m);font-size:10px;text-transform:uppercase}.detail b{display:block;margin-top:3px}.wide{grid-column:1/-1}
@media(max-width:780px){.top{padding:0 12px}.tabs{padding-left:7px}main{padding:12px}.grid{grid-template-columns:1fr}.side{height:auto;position:static}.units{max-height:290px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.hero,.stockbar,.filters{flex-direction:column;align-items:stretch}.filters input,.filters select{max-width:none}.tire{width:53px;min-height:60px}.ax{gap:4px}.event{grid-template-columns:92px 70px 1fr}.details,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}th:nth-child(3),td:nth-child(3),th:nth-child(6),td:nth-child(6){display:none}}
</style></head><body>
<header class="top"><img src="/logo.png" alt="Diemar" onerror="this.style.display='none'"><span class="brand">Gomería</span><span class="who" id="who"></span></header>
<nav class="tabs"><button class="tab on" data-tab="fleet">Flota y mapas</button><button class="tab" data-tab="stock">Stock de cubiertas</button><button class="tab" data-tab="register">Registrar trabajo</button></nav>
<main><section class="panel on" id="fleet"><div class="grid"><aside class="card side"><h1>Unidades</h1><p class="sub" id="unitCount">Cargando…</p><input class="search" id="unitSearch" placeholder="Buscar patente, interno o sucursal"><div class="units" id="unitList"></div></aside><div id="unitDetail"><div class="card loading"><span class="pulse"></span>Cargando mapas…</div></div></div></section>
<section class="panel" id="stock"><div class="metrics" id="metrics"></div><div class="card"><div class="stockbar"><div class="filters"><input id="stockSearch" placeholder="Buscar código, marca o medida"><select id="stockState"><option value="">Todos los estados</option><option value="stock">En stock</option><option value="montada">Montadas</option><option value="reparacion">En reparación</option><option value="recapado">En recapado</option><option value="baja">De baja</option></select></div><button class="btn" id="newTire">+ Alta de cubierta</button></div><div class="tablewrap"><table><thead><tr><th>Código</th><th>Estado</th><th>Marca / modelo</th><th>Medida</th><th>Remanente</th><th>Ubicación</th></tr></thead><tbody id="stockRows"></tbody></table></div></div></section>
<section class="panel" id="register"><div class="card register"><h1>Registrar trabajo</h1><p class="sub">Revisá la propuesta antes de guardar el movimiento.</p><label>Unidad</label><select id="workUnit"><option value="">Elegir patente</option></select><label>¿Qué hiciste?</label><textarea id="workText" placeholder="Ej: giré las dos de afuera del lado izquierdo"></textarea><p class="help">Podés indicar posiciones, código de cubierta, milímetros y kilometraje.</p><button class="btn" id="interpret">Interpretar movimiento</button><div id="workResult"></div></div></section></main>
<div class="modalbg" id="tireModal"><div class="modal"><div class="modaltop"><h2 id="tireTitle">Cubierta</h2><button class="close" data-close="tireModal">×</button></div><div id="tireBody"></div></div></div>
<div class="modalbg" id="newModal"><div class="modal"><div class="modaltop"><h2>Alta de cubierta</h2><button class="close" data-close="newModal">×</button></div><div class="formgrid"><div><label>Código / número de fuego</label><input id="nCode"></div><div><label>Medida</label><input id="nSize" placeholder="295/80R22.5"></div><div><label>Marca</label><input id="nBrand"></div><div><label>Modelo</label><input id="nModel"></div><div><label>Remanente inicial (mm)</label><input id="nMm" type="number" min="0" step=".1"></div><div><label>Costo de compra</label><input id="nCost" type="number" min="0" step=".01"></div><div class="wide"><label>Observaciones</label><input id="nObs"></div></div><div id="newError"></div><button class="btn" id="saveTire">Guardar cubierta</button></div></div>
<script>
"use strict";const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPat=p=>{let m=String(p||'').match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);if(m)return`${m[1]} ${m[2]} ${m[3]}`;m=String(p||'').match(/^([A-Z]{3})(\d{3})$/);return m?`${m[1]} ${m[2]}`:p},fmtDate=v=>v?new Date(v).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
let D={units:[],configs:[],tires:[],summary:{},user:null,selected:null,parte:null};async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`Error ${r.status}`);return d}
function tab(n,marcar=true){$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===n));$$('.panel').forEach(x=>x.classList.toggle('on',x.id===n));if(n==='stock'&&!D.tires.length)loadStock();if(marcar&&location.hash.slice(1)!==n)window.history.replaceState(null,'','#'+n)}$$('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
/* La solapa vive en la direccion: /gomeria#register abre directo la carga de
   texto, que es a donde apunta el QR del taller. Volver atras la respeta. */
const SOLAPAS=['fleet','stock','register'];
function solapaDeLaUrl(){const h=location.hash.slice(1);return SOLAPAS.includes(h)?h:null}
addEventListener('hashchange',()=>{const h=solapaDeLaUrl();if(h)tab(h,false)});
function renderUnits(){let q=$('#unitSearch').value.toLowerCase().trim(),a=D.units.filter(u=>[u.patente,u.interno,u.marca,u.modelo,u.sucursal].join(' ').toLowerCase().includes(q));$('#unitCount').textContent=`${D.units.length} patentes activas`;$('#unitList').innerHTML=a.length?a.map(u=>`<button class="unit ${D.selected===u.patente?'on':''}" data-pat="${esc(u.patente)}"><i class="dot ${!u.posiciones?'warn':u.montadas===u.posiciones?'ok':''}"></i><span class="plate">${esc(fmtPat(u.patente))}</span><span class="um">${esc([u.interno&&'int. '+u.interno,u.sucursal].filter(Boolean).join(' · '))}</span><span class="oc">${u.posiciones?u.montadas+'/'+u.posiciones:'Sin mapa'}</span></button>`).join(''):'<div class="emptymsg">Sin coincidencias.</div>';$$('.unit').forEach(x=>x.onclick=()=>selectUnit(x.dataset.pat))}$('#unitSearch').oninput=renderUnits;
function tire(p){let mm=p.remanente_mm,c=!p.cubierta_id?'empty':mm!=null&&+mm<=4?'low':mm!=null&&+mm<=8?'mid':'';return`<button class="tire ${c}" data-tire="${p.cubierta_id||''}"><span class="pos">${esc(p.posicion)}</span><div class="code">${p.cubierta?esc(p.cubierta):'Vacía'}</div><div class="mm">${mm!=null?esc(mm)+' mm':''}</div></button>`}
function mapHtml(a){let e=new Map,aux=null;a.forEach(p=>{if(p.es_auxilio){aux=p;return}if(!e.has(p.eje))e.set(p.eje,[]);e.get(p.eje).push(p)});let h='';[...e].sort((x,y)=>x[0]-y[0]).forEach(([n,p])=>{p.sort((x,y)=>x.orden-y.orden);let m=Math.ceil(p.length/2);h+=`<div class="ax"><span class="axn">E${n}</span>${p.slice(0,m).map(tire).join('')}<span class="bar"></span>${p.slice(m).map(tire).join('')}</div>`});if(aux)h+=`<div class="spare"><b>Auxilio</b>${tire(aux)}</div>`;return`<div class="map">${h||'<div class="emptymsg">Esta unidad no tiene mapa configurado.</div>'}</div>`}
function desc(e){let a=[];if(e.desde_posicion)a.push('desde '+e.desde_posicion);if(e.hasta_posicion)a.push('a '+e.hasta_posicion);if(e.remanente_mm!=null)a.push(e.remanente_mm+' mm');if(e.km_unidad!=null)a.push(Number(e.km_unidad).toLocaleString('es-AR')+' km');return a.join(' · ')}function listaEventos(a){return a.length?a.map(e=>`<div class="event"><span class="date">${fmtDate(e.fecha)}</span><span class="type">${esc(e.tipo)}</span><div><b>${esc(e.cubierta||'Movimiento')}</b> ${esc(desc(e))}<div class="note">${esc(e.nota||e.texto_original||e.usuario||'')}</div></div></div>`).join(''):'<div class="emptymsg">Todavía no hay movimientos.</div>'}
async function selectUnit(pat){D.selected=pat;renderUnits();$('#unitDetail').innerHTML='<div class="card loading"><span class="pulse"></span>Cargando unidad…</div>';try{let d=await api('/api/mapa?patente='+encodeURIComponent(pat)),u=d.unidad,no='';if(!d.mapa.length&&D.user?.puede_administrar)no=`<div class="card section"><h3>Asignar mapa</h3><div class="actions"><select id="mapChoice"><option value="">Elegir configuración</option>${D.configs.map(c=>`<option value="${c.id}">${esc(c.nombre)} — ${esc(c.descripcion||c.posiciones+' posiciones')}</option>`).join('')}</select><button class="btn" id="saveMap">Asignar</button></div></div>`;$('#unitDetail').innerHTML=`<div class="card"><div class="hero"><div><h2>${esc(fmtPat(u.patente))}</h2><div class="meta">${[u.interno&&'Interno '+u.interno,u.marca,u.modelo,u.sucursal,u.uso].filter(Boolean).map(esc).join(' · ')}</div></div><span class="pill">${d.mapa.filter(x=>x.cubierta_id).length}/${d.mapa.length} posiciones ocupadas</span></div>${mapHtml(d.mapa)}</div>${no}<div class="card section"><h3>Historial de cambios de la unidad</h3>${listaEventos(d.historial||[])}</div>`;$$('.tire[data-tire]').filter(x=>x.dataset.tire).forEach(x=>x.onclick=()=>openTire(x.dataset.tire));if($('#saveMap'))$('#saveMap').onclick=async()=>{let c=+$('#mapChoice').value;if(!c)return;await api('/api/unidades',{op:'asignar_mapa',unidad_id:u.id,configuracion_id:c});await dashboard();await selectUnit(pat)}}catch(e){$('#unitDetail').innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
const labs={stock:'En stock',montada:'Montadas',reparacion:'Reparación',recapado:'Recapado',baja:'De baja'};function metrics(){$('#metrics').innerHTML=Object.keys(labs).map(k=>`<div class="metric"><b>${D.summary[k]||0}</b><span>${labs[k]}</span></div>`).join('')}async function loadStock(){try{let d=await api('/api/inventario-cubiertas');D.tires=d.cubiertas;D.summary=d.resumen;metrics();renderStock()}catch(e){$('#stockRows').innerHTML=`<tr><td colspan="6" class="error">${esc(e.message)}</td></tr>`}}function renderStock(){let q=$('#stockSearch').value.toLowerCase().trim(),s=$('#stockState').value,a=D.tires.filter(t=>(!s||t.estado===s)&&[t.codigo,t.marca,t.modelo,t.medida,t.patente].join(' ').toLowerCase().includes(q));$('#stockRows').innerHTML=a.length?a.map(t=>`<tr data-id="${t.id}"><td><b>${esc(t.codigo)}</b></td><td><span class="status ${esc(t.estado)}">${esc(t.estado)}</span></td><td>${esc([t.marca,t.modelo].filter(Boolean).join(' · ')||'—')}</td><td>${esc(t.medida||'—')}</td><td>${t.remanente_mm!=null?esc(t.remanente_mm)+' mm':'—'}</td><td>${t.patente?esc(fmtPat(t.patente)+' · '+t.posicion):'Depósito'}</td></tr>`).join(''):'<tr><td colspan="6" class="emptymsg">No hay cubiertas.</td></tr>';$$('#stockRows tr[data-id]').forEach(x=>x.onclick=()=>openTire(x.dataset.id))}$('#stockSearch').oninput=renderStock;$('#stockState').onchange=renderStock;
function modal(id,on=true){$('#'+id).classList.toggle('on',on)}$$('[data-close]').forEach(x=>x.onclick=()=>modal(x.dataset.close,false));$$('.modalbg').forEach(x=>x.onclick=e=>{if(e.target===x)modal(x.id,false)});async function openTire(id){modal('tireModal');$('#tireBody').innerHTML='<div class="loading"><span class="pulse"></span>Cargando…</div>';try{let d=await api('/api/cubierta?id='+id),t=d.cubierta;$('#tireTitle').textContent='Cubierta '+t.codigo;let ctl=D.user?.puede_administrar&&t.estado!=='montada'?`<div class="section"><h3>Cambiar estado</h3><div class="actions"><select id="tState"><option value="stock">Stock</option><option value="reparacion">Reparación</option><option value="recapado">Recapado</option><option value="baja">Baja</option></select><input id="tNote" placeholder="Motivo u observación"><button class="btn alt" id="saveState">Guardar</button></div></div>`:'';$('#tireBody').innerHTML=`<div class="details"><div class="detail"><span>Estado</span><b>${esc(t.estado)}</b></div><div class="detail"><span>Ubicación</span><b>${t.patente?esc(fmtPat(t.patente)+' · '+t.posicion):'Depósito'}</b></div><div class="detail"><span>Marca / modelo</span><b>${esc([t.marca,t.modelo].filter(Boolean).join(' · ')||'—')}</b></div><div class="detail"><span>Medida</span><b>${esc(t.medida||'—')}</b></div><div class="detail"><span>Remanente</span><b>${t.remanente_mm!=null?esc(t.remanente_mm)+' mm':'—'}</b></div><div class="detail"><span>Kilómetros</span><b>${Number(t.km_acumulados||0).toLocaleString('es-AR')}</b></div></div>${ctl}<div class="section"><h3>Historial de la cubierta</h3>${listaEventos(d.historial||[])}</div>`;if($('#tState')){$('#tState').value=t.estado;$('#saveState').onclick=async()=>{await api('/api/cubiertas',{op:'estado',id:t.id,estado:$('#tState').value,nota:$('#tNote').value});modal('tireModal',false);await loadStock();if(D.selected)await selectUnit(D.selected)}}}catch(e){$('#tireBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
$('#newTire').onclick=()=>modal('newModal');$('#saveTire').onclick=async()=>{let b=$('#saveTire');b.disabled=true;$('#newError').innerHTML='';try{await api('/api/cubiertas',{op:'alta',codigo:$('#nCode').value,medida:$('#nSize').value,marca:$('#nBrand').value,modelo:$('#nModel').value,remanente_mm:$('#nMm').value,costo_compra:$('#nCost').value,observaciones:$('#nObs').value});['nCode','nSize','nBrand','nModel','nMm','nCost','nObs'].forEach(x=>$('#'+x).value='');modal('newModal',false);await loadStock()}catch(e){$('#newError').innerHTML=`<p class="error">${esc(e.message)}</p>`}finally{b.disabled=false}};
async function interpret(){let p=$('#workUnit').value,t=$('#workText').value.trim();if(!p||!t)return;let out=$('#workResult'),b=$('#interpret');b.disabled=true;out.innerHTML='<div class="result"><span class="pulse"></span>Interpretando…</div>';try{let d=await api('/api/interpretar',{patente:p,texto:t}),x=d.propuesta;D.parte=d.parte_id;if(!x.acciones?.length)out.innerHTML=`<div class="result error">${esc(x.pregunta||'No quedó claro el movimiento.')}</div>`;else{out.innerHTML=`<div class="result proposal"><b>${esc(x.resumen||'Movimiento interpretado')}</b><ul>${x.acciones.map(a=>`<li>${esc(a.tipo)} · ${esc(a.posicion||'')}${a.posicion_destino?' → '+esc(a.posicion_destino):''}${a.cubierta?' · '+esc(a.cubierta):''}</li>`).join('')}</ul><div class="actions"><button class="btn" id="confirm">Confirmar</button><button class="btn alt" id="discard">Descartar</button></div></div>`;$('#confirm').onclick=confirm;$('#discard').onclick=discard}}catch(e){out.innerHTML=`<div class="result error">${esc(e.message)}</div>`}finally{b.disabled=false}}async function confirm(){try{let d=await api('/api/confirmar',{parte_id:D.parte});$('#workResult').innerHTML=`<div class="result success">Guardado.<br>${d.hecho.map(esc).join('<br>')}</div>`;$('#workText').value='';await dashboard();if(D.selected)await selectUnit(D.selected);if(D.tires.length)await loadStock()}catch(e){$('#workResult').innerHTML=`<div class="result error">${esc(e.message)}</div>`}}async function discard(){await api('/api/descartar',{parte_id:D.parte}).catch(()=>{});$('#workResult').innerHTML=''}$('#interpret').onclick=interpret;
async function dashboard(){let d=await api('/api/tablero');D.units=d.unidades;D.configs=d.configuraciones;D.summary=d.resumen_stock;renderUnits();metrics();$('#workUnit').innerHTML='<option value="">Elegir patente</option>'+D.units.map(u=>`<option value="${esc(u.patente)}">${esc(fmtPat(u.patente))}${u.interno?' · int. '+esc(u.interno):''}</option>`).join('');if(!D.selected&&D.units.length){let m=location.pathname.match(/\/u\/([^/]+)/);D.selected=m?decodeURIComponent(m[1]):D.units[0].patente}if(D.selected)await selectUnit(D.selected)}async function init(){const inicial=solapaDeLaUrl();if(inicial)tab(inicial,false);try{D.user=await api('/api/yo');$('#who').innerHTML=`${esc(D.user.nombre)} <a href="/salir">Salir</a>`;if(!D.user.puede_administrar)$('#newTire').style.display='none';await dashboard()}catch(e){$('#unitDetail').innerHTML=`<div class="card error">${esc(e.message)}</div>`}}init();
</script></body></html>
