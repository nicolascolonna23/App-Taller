<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stock de Cubiertas | Diemar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a1a' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --plane:#08090b; --surface-1:#12161a; --surface-2:#171c21; --surface-3:#1d2329;
    --hairline:rgba(255,255,255,.07); --hairline-2:rgba(255,255,255,.12);
    --ink:#e9ecef; --ink-2:#a9b0b8; --ink-muted:#7b828b;
    --brand:#ff7a1a; --brand-soft:rgba(255,122,26,.12);
    --ok:#0ca30c; --warn:#fab219; --serio:#ec835a; --mal:#d03b3b; --gris:#7b828b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;max-width:100%}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
       background:var(--plane);color:var(--ink);font-size:14.5px;line-height:1.5;
       -webkit-font-smoothing:antialiased}

  .barra{display:flex;align-items:center;gap:14px;padding:13px 22px;position:relative;
    background:var(--surface-1);border-bottom:1px solid var(--hairline);flex-wrap:wrap}
  .barra::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--brand),rgba(255,122,26,0) 55%)}
  .barra img{height:26px}
  .barra .t{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:600}
  .barra a.volver{color:var(--ink-muted);text-decoration:none;font-size:12px}
  .barra a.volver:hover{color:var(--brand)}
  .barra .quien{margin-left:auto;display:flex;align-items:center;gap:12px;
    font-size:12px;color:var(--ink-2)}
  .barra .quien a{color:var(--ink-muted);text-decoration:none;font-size:11.5px}

  .env{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
  h1{margin:0 0 20px;font-size:24px;font-weight:600;letter-spacing:-.02em}

  /* ---------- resumen por medida ---------- */
  .medidas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    margin-bottom:22px}
  .med{background:var(--surface-1);border:1px solid var(--hairline);border-radius:12px;
    padding:15px 16px;position:relative;overflow:hidden}
  .med::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--brand)}
  .med .cual{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:600}
  .med .n{font-size:30px;font-weight:600;line-height:1.1;margin-top:8px;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .med .n small{font-size:13px;color:var(--ink-muted);font-weight:500;letter-spacing:0}
  .med .detalle{font-size:11.5px;color:var(--ink-muted);margin-top:4px}

  /* ---------- filtros ---------- */
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;
    margin-bottom:14px;background:var(--surface-1);border:1px solid var(--hairline);
    border-radius:12px}
  input,select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface-3);
    border:1px solid var(--hairline);border-radius:9px;padding:9px 12px;outline:none;
    min-width:150px;transition:border-color .15s}
  input:focus,select:focus{border-color:rgba(255,122,26,.55)}
  input::placeholder{color:var(--ink-muted)}
  input.buscar{flex:1;min-width:220px}
  .cuantas{margin-left:auto;font-size:12px;color:var(--ink-muted);white-space:nowrap}

  /* ---------- tabla ---------- */
  .caja{background:var(--surface-1);border:1px solid var(--hairline);
    border-radius:var(--radius);overflow:hidden}
  .tabla{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:820px;font-variant-numeric:tabular-nums}
  th{background:#0d1114;color:var(--ink-muted);font-size:10.5px;font-weight:600;
    letter-spacing:1.3px;text-transform:uppercase;padding:12px 11px;text-align:left;
    white-space:nowrap;border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:2}
  td{padding:11px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,122,26,.045)}
  td.num,th.num{text-align:right}
  .cod{font-weight:700;color:var(--brand);letter-spacing:.3px}
  .donde{color:var(--ink-2)}
  .vacio{padding:40px;text-align:center;color:var(--ink-muted)}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;
    font-size:11px;font-weight:600;letter-spacing:.4px;border:1px solid currentColor}
  .e-stock{color:var(--ok);background:rgba(12,163,12,.10)}
  .e-montada{color:var(--brand);background:var(--brand-soft)}
  .e-reparacion{color:var(--warn);background:rgba(250,178,25,.10)}
  .e-recapado{color:var(--serio);background:rgba(236,131,90,.10)}
  .e-baja{color:var(--gris);background:rgba(123,130,139,.10)}

  .mm{font-weight:600}
  .mm.bajo{color:var(--mal)} .mm.medio{color:var(--warn)}

  @media (max-width:640px){
    .barra{padding:11px 14px}
    .env{padding:20px 14px 40px}
    h1{font-size:20px}
  }
</style>
</head>
<body>

<div class="barra">
  <img src="/logo.png" alt="Diemar" onerror="this.style.display='none'">
  <span class="t">Stock de Cubiertas</span>
  <a class="volver" href="/">‹ Inicio</a>
  <a class="volver" href="/gomeria">Cargar movimiento</a>
  <span class="quien" id="quien"></span>
</div>

<div class="env">
  <h1>Cubiertas</h1>

  <div class="medidas" id="medidas"></div>

  <div class="filtros">
    <input class="buscar" id="q" placeholder="Buscar por código, marca, modelo o patente…">
    <select id="estado">
      <option value="">Todos los estados</option>
      <option value="stock">En stock</option>
      <option value="montada">Montadas</option>
      <option value="reparacion">En reparación</option>
      <option value="recapado">En recapado</option>
      <option value="baja">De baja</option>
    </select>
    <select id="medida"><option value="">Todas las medidas</option></select>
    <span class="cuantas" id="cuantas"></span>
  </div>

  <div class="caja"><div class="tabla" id="tabla">
    <div class="vacio">Cargando…</div>
  </div></div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ESTADO = { stock:'En stock', montada:'Montada', reparacion:'Reparación',
                 recapado:'Recapado', baja:'Baja' };

const nf = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const fmt = n => (n == null || !isFinite(n)) ? '—' : nf.format(Math.round(n));

function fmtPat(p){
  const m = String(p||'').match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);
  if (m) return `${m[1]} ${m[2]} ${m[3]}`;
  const o = String(p||'').match(/^([A-Z]{3})(\d{3})$/);
  return o ? `${o[1]} ${o[2]}` : (p || '');
}

/* El remanente es lo que decide si hay que cambiarla: se colorea. */
function celdaMM(mm){
  if (mm == null) return '<td class="num">—</td>';
  const c = mm <= 4 ? ' bajo' : mm <= 8 ? ' medio' : '';
  return `<td class="num"><span class="mm${c}">${esc(mm)}</span></td>`;
}

function pintarMedidas(resumen){
  if (!resumen.length){ $('#medidas').innerHTML = ''; return; }
  $('#medidas').innerHTML = resumen.map(m => `
    <div class="med">
      <div class="cual">${esc(m.medida)}</div>
      <div class="n">${m.en_stock}<small> en stock</small></div>
      <div class="detalle">${m.montadas} montadas${
        m.en_reparacion ? ' · ' + m.en_reparacion + ' en reparación' : ''}${
        m.en_recapado ? ' · ' + m.en_recapado + ' en recapado' : ''}</div>
    </div>`).join('');
}

function pintarTabla(d){
  if (!d.cubiertas.length){
    $('#tabla').innerHTML = '<div class="vacio">No hay cubiertas que coincidan con eso.</div>';
    $('#cuantas').textContent = '';
    return;
  }
  $('#cuantas').textContent = d.total === d.mostradas
    ? `${d.total} cubiertas`
    : `mostrando ${d.mostradas} de ${d.total}`;

  $('#tabla').innerHTML = `<table><thead><tr>
      <th>Código</th><th>Marca</th><th>Modelo</th><th>Medida</th>
      <th>Estado</th><th>Dónde está</th>
      <th class="num">Dibujo</th><th class="num">Km</th><th class="num">Recap.</th>
    </tr></thead><tbody>` +
    d.cubiertas.map(c => `<tr>
      <td class="cod">${esc(c.codigo)}</td>
      <td>${esc(c.marca || '—')}</td>
      <td>${esc(c.modelo || '—')}</td>
      <td>${esc(c.medida || '—')}</td>
      <td><span class="pill e-${esc(c.estado)}">${esc(ESTADO[c.estado] || c.estado)}</span></td>
      <td class="donde">${c.patente ? esc(fmtPat(c.patente)) + ' · ' + esc(c.posicion)
                                     : esc(c.ubicacion)}</td>
      ${celdaMM(c.remanente_mm)}
      <td class="num">${fmt(c.km_acumulados)}</td>
      <td class="num">${c.recapados || 0}</td>
    </tr>`).join('') + '</tbody></table>';
}

let pedido = null;
async function cargar(){
  const p = new URLSearchParams();
  if ($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if ($('#estado').value) p.set('estado', $('#estado').value);
  if ($('#medida').value) p.set('medida', $('#medida').value);

  const mio = Symbol();
  pedido = mio;
  try{
    const r = await fetch('/api/stock?' + p);
    const d = await r.json();
    if (pedido !== mio) return;      // llegó una respuesta vieja: se descarta
    if (!r.ok) throw new Error(d.error || 'Error ' + r.status);

    pintarMedidas(d.resumen);
    pintarTabla(d);

    const sel = $('#medida');
    if (sel.options.length === 1 && d.medidas.length){
      sel.innerHTML = '<option value="">Todas las medidas</option>' +
        d.medidas.map(m => `<option>${esc(m)}</option>`).join('');
    }
  }catch(e){
    $('#tabla').innerHTML = `<div class="vacio">No se pudo cargar: ${esc(e.message)}</div>`;
  }
}

/* Al tipear no se consulta en cada tecla: se espera a que pare. */
let espera;
$('#q').addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(cargar, 250); });
$('#estado').addEventListener('change', cargar);
$('#medida').addEventListener('change', cargar);

fetch('/api/yo').then(r => r.ok ? r.json() : null).then(d => {
  if (d) $('#quien').innerHTML = `${esc(d.nombre)} <a href="/salir">Salir</a>`;
}).catch(() => {});

cargar();
</script>
</body>
</html>
