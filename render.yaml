# Deploy automático en Render. Cada push a la rama publica la versión nueva.
#
# OJO: este archivo solo lo lee Render si el servicio se creó como Blueprint.
# El de producción se creó a mano desde el panel, así que hoy lo de acá no se
# aplica: manda lo que esté cargado en Settings y en Environment. Se mantiene
# igual para que quede escrito con qué está pensado que corra —y para poder
# recrear el servicio— pero cualquier cambio hay que hacerlo también en el
# panel. Se vio con la versión de Python: acá dice 3.12.6 y el log del deploy
# decía "Using Python version 3.14.3 (default)".
services:
  - type: web
    name: app-taller
    runtime: python
    plan: starter                 # el gratuito se duerme y tarda en despertar
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    healthCheckPath: /login
    envVars:
      - key: SUPABASE_DB_URL      # Connect → Connection String → Session pooler
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPEN_METEO_APIKEY  # Opcional: clave comercial de Open-Meteo (viento en ruta)
        sync: false
      - key: ANTHROPIC_MODEL    # Opcional: modelo usado por Titán, el asistente
        value: "claude-opus-5"
      - key: USUARIO_INICIAL      # "usuario:Nombre Completo:contraseña". Borrala después.
        sync: false
      - key: PEDIDOS_SIMULTANEOS  # Cuántos pedidos se atienden a la vez
        value: "24"
      - key: PYTHON_VERSION
        value: "3.12.6"
