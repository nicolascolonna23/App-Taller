name: Odometros a Supabase

# Lee el odómetro de cada móvil directo del satelital Hawk y lo guarda en la
# tabla odometros de Supabase. Antes esto se bajaba del repo ServiceDM, que
# corre de lunes a viernes: el fin de semana la serie quedaba con agujeros.
# Ahora la app entra sola y corre los siete días.
#
# Sale a las 08:30 ART, media hora después del scraper de ServiceDM, que
# sigue escribiendo la planilla de services. Son dos sesiones distintas
# contra el mismo satelital y conviene que no se pisen.
#
# También se dispara a mano desde la pestaña Actions, con "Run workflow".

on:
  schedule:
    - cron: "30 11 * * *"     # 08:30 ART, todos los días
  workflow_dispatch:
    inputs:
      solo_empresas:
        description: "Leer solo estas empresas (subcadena, separadas por coma). Vacío = toda la flota."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install selenium requests "psycopg[binary]"

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false

      # Selenium se busca solo el chromedriver que corresponde a este Chrome.
      # El que trae la máquina de GitHub suele ser de otra versión y rompe.
      - name: Limpiar chromedriver del PATH
        run: sudo rm -f "$(command -v chromedriver)" || true

      - name: Leer Hawk y guardar en Supabase
        env:
          HAWK_USER: ${{ secrets.HAWK_USER }}
          HAWK_PASS: ${{ secrets.HAWK_PASS }}
          SOLO_EMPRESAS: ${{ github.event.inputs.solo_empresas }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python gomeria/hawk.py 2>&1 | tee salida.txt

      # Para no tener que abrir el log: el resumen de la corrida queda en la
      # portada del run, que es donde uno mira cuando quiere saber si entró.
      - name: Resumen
        if: always()
        run: |
          {
            echo '### Lecturas del satelital'
            echo '```'
            tail -n 12 salida.txt 2>/dev/null || echo '(el job falló antes de leer nada)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
