name: Odometros a Supabase

# Lee el odómetro de cada móvil directo del satelital Hawk y lo guarda en la
# tabla odometros de Supabase. Antes esto se bajaba del repo ServiceDM, que
# corre de lunes a viernes: el fin de semana la serie quedaba con agujeros.
# Ahora la app entra sola y corre los siete días, sábados y domingos incluidos.
#
# Sale a las 05:00 ART, tres horas antes que el scraper de ServiceDM, que
# sigue escribiendo la planilla de services. Son dos sesiones distintas
# contra el mismo satelital y conviene que no se pisen.
#
# Al terminar manda un mail, salga bien o salga mal. El que avisa que salió
# bien no es de adorno: si un día no llega ninguno de los dos, es que el job
# ni arrancó, y eso no se nota de ninguna otra manera.
#
# También se dispara a mano desde la pestaña Actions, con "Run workflow".

on:
  schedule:
    - cron: "0 8 * * *"       # 05:00 ART, todos los días
  workflow_dispatch:
    inputs:
      solo_empresas:
        description: "Leer solo estas empresas (subcadena, separadas por coma). Vacío = toda la flota."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install selenium requests "psycopg[binary]"

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false

      # Selenium se busca solo el chromedriver que corresponde a este Chrome.
      # El que trae la máquina de GitHub suele ser de otra versión y rompe.
      - name: Limpiar chromedriver del PATH
        run: sudo rm -f "$(command -v chromedriver)" || true

      - name: Leer Hawk y guardar en Supabase
        env:
          HAWK_USER: ${{ secrets.HAWK_USER }}
          HAWK_PASS: ${{ secrets.HAWK_PASS }}
          SOLO_EMPRESAS: ${{ github.event.inputs.solo_empresas }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python gomeria/hawk.py 2>&1 | tee salida.txt

      # El resumen sirve para el mail y para la portada del run. Se arma acá
      # una sola vez, con if:always() para que también exista cuando el paso
      # anterior se cayó, que es justo cuando más hace falta.
      - name: Armar el resumen
        if: always()
        run: |
          echo "FECHA_AR=$(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M')" >> "$GITHUB_ENV"

          # Las líneas que importan: la flota, cuántas se leyeron y qué dijo
          # la base. Si no hay ninguna, el job se cayó antes de leer nada y
          # eso también hay que poder contarlo. El patrón esquiva las vocales
          # acentuadas a propósito: según el locale del runner, un punto
          # matchea un byte y no una letra, y "leídos" se escapaba.
          resumen=$(grep -E '^(flota|sin lectura|\[supabase\]|nuevas)|con kilometraje' salida.txt 2>/dev/null | tail -n 20)
          [ -n "$resumen" ] || resumen="(el job se cayó antes de leer nada)"

          # El delimitador lleva el id de la corrida para que ninguna línea
          # del log pueda cerrar el bloque antes de tiempo.
          {
            echo "RESUMEN<<FIN_$GITHUB_RUN_ID"
            echo "$resumen"
            echo "FIN_$GITHUB_RUN_ID"
            echo "LOG<<FIN_$GITHUB_RUN_ID"
            tail -n 40 salida.txt 2>/dev/null || echo "(sin salida)"
            echo "FIN_$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Resumen en la portada del run
        if: always()
        run: |
          {
            echo '### Lecturas del satelital'
            echo '```'
            echo "${RESUMEN}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mail exito
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: GitHub Odometros
          to: ${{ secrets.EMAIL_FROM }}
          subject: "✅ Odometros OK"
          body: |
            Las lecturas del satelital entraron a la base.

            Hora Argentina:
            ${{ env.FECHA_AR }}

            ${{ env.RESUMEN }}

            La corrida:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Mail error
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: GitHub Odometros
          to: ${{ secrets.EMAIL_FROM }}
          subject: "❌ Error en los odometros"
          body: |
            Hoy no entraron las lecturas del satelital.

            Hora Argentina:
            ${{ env.FECHA_AR }}

            Últimas líneas:
            ${{ env.LOG }}

            La corrida:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Mail cancelado
        if: cancelled()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: GitHub Odometros
          to: ${{ secrets.EMAIL_FROM }}
          subject: "⚠️ Odometros cancelado"
          body: |
            La corrida se cortó: pasó el límite de 20 minutos, o alguien la
            canceló a mano. Las lecturas de hoy pueden no haber entrado.

            Hora Argentina:
            ${{ env.FECHA_AR }}

            La corrida:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
