<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repuestos | Titán Flota</title>

<style>
/* Repuestos · Titán Flota. Los colores salen de tema.js (--bg, --card,
   --acc…); acá van la forma y la jerarquía. */
:root{
  --bg:#f4f6f8; --bg2:#f0f3f7; --card:#fff; --card2:#f0f3f7; --raise:#fff;
  --rule:#e1e6ed; --rule2:#c9d2de;
  --ink:#14243a; --ink2:#34465f; --muted:#5a6b80;
  --acc:#2563eb; --acc-hi:#1d4ed8; --acc-soft:rgba(37,99,235,.09); --acc-line:rgba(37,99,235,.35);
  --green:#15803d; --green-soft:rgba(21,128,61,.10);
  --red:#b91c1c;   --red-soft:rgba(185,28,28,.09);
  --cyan:#1d4ed8;  --cyan-soft:rgba(29,78,216,.10);
  --body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --disp:var(--body);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

/* ---------- barra superior ---------- */
.top{background:var(--card);border-bottom:1px solid var(--rule);padding:0 20px}
.top-in{max-width:1280px;margin:0 auto}
/* La fila de la marca es la barra azul noche del sistema, de borde a borde. */
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;min-height:60px;
  background:var(--tf-nav,#14243a);box-shadow:0 0 0 100vmax var(--tf-nav,#14243a);clip-path:inset(0 -100vmax);color:#fff}
.brand img{height:34px;width:auto;display:block}
.brand .divider{width:1px;height:26px;background:rgba(255,255,255,.2)}
.brand h1{font-size:16px;font-weight:650;letter-spacing:0;margin:0;color:#fff}
.brand h1 em{font-style:normal;color:inherit}
.brand .sub{font-size:12px;color:rgba(255,255,255,.74);display:flex;align-items:center;gap:7px}
.brand .sub::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ccf85}
body .brand .nav-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.78);background:transparent;border:1px solid rgba(255,255,255,.14);border-radius:8px;
  padding:6px 11px;white-space:nowrap}
body .brand .nav-link:hover{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.brand :focus-visible{outline-color:#fff!important}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;margin:16px 0;
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--card)}
.kpi{background:var(--card);padding:14px 16px;line-height:1.2;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
.kpi b{font-size:22px;font-weight:700;display:block;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:20px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-size:14px;font-weight:600;padding:12px 2px;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:190px}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--card);border:1px solid var(--rule2);border-radius:8px;padding:9px 11px;width:100%;
  color:var(--ink);transition:border-color .15s}
input::placeholder{color:var(--muted)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.flab{font-size:12px;font-weight:600;color:var(--muted);margin:0 -2px 0 6px}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,select:focus{
  border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
select{appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:9px 15px;
  font-size:14px;font-weight:600}
.btn:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--rule2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--acc);background:var(--acc-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.count{font-size:12px;color:var(--muted)}

/* ---------- tabla ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
   text-align:left;padding:10px 13px;border-bottom:1px solid var(--rule);white-space:nowrap;
   background:var(--card2);position:sticky;top:0;z-index:2}
td{padding:10px 13px;border-bottom:1px solid var(--rule);vertical-align:middle;color:var(--ink2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--acc-soft)}
tr.baja td,tr.baja .code{color:var(--muted)}
tr.baja .desc{text-decoration:line-through;color:var(--muted)}
.code{font-family:var(--mono);font-size:12px;color:var(--acc-hi)}
.desc{font-weight:600;color:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stock{font-size:16px;font-weight:700;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rubro{font-size:12px;color:var(--muted)}
.acts{white-space:nowrap;text-align:right}
.ic{border:1px solid var(--rule2);background:var(--card);border-radius:8px;width:32px;height:30px;
    font-size:15px;line-height:1;color:var(--ink2);margin-left:4px;padding:0;transition:all .13s}
.ic:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.ic.plus:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.ic.minus:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:999px;border:1px solid transparent}
.t-ok,.t-ent{background:var(--green-soft);color:var(--green)}
.t-rep{background:rgba(161,92,7,.10);color:#a15c07}
.t-cero{background:var(--card2);color:var(--muted);border-color:var(--rule)}
.t-neg,.t-sal{background:var(--red-soft);color:var(--red)}
.t-baja{background:transparent;color:var(--muted);border-color:var(--rule2)}
.t-aju{background:var(--cyan-soft);color:var(--cyan)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}

/* ---------- patente ---------- */
.plate{display:inline-block;background:#fff;border:1px solid #14243a;border-radius:4px;overflow:hidden;
       text-align:center;line-height:1}
.plate i{display:block;background:#14243a;height:5px}
.plate span{display:block;font-family:var(--mono);font-weight:700;letter-spacing:.12em;padding:3px 8px 4px;
            font-size:12px;color:#14243a}
.plate.big span{font-size:20px;padding:7px 12px 9px;letter-spacing:.16em}
.plate.big i{height:8px}
.plate-in{border:0;background:transparent;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.16em;
          text-align:center;text-transform:uppercase;padding:8px 6px 10px;width:100%;color:#14243a}
.plate-in::placeholder{color:#9aa6b2}
.plate-in:focus{outline:none}
.plate-wrap{display:block;width:236px;max-width:100%}
.plate-wrap i{height:8px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,36,58,.45);display:flex;
       align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.modal{background:var(--card);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:530px;
       box-shadow:0 24px 60px rgba(20,36,58,.22)}
.modal h2{font-size:17px;font-weight:700;margin:0;padding:16px 22px;border-bottom:1px solid var(--rule);color:var(--ink)}
.modal .body{padding:20px 22px}
.modal .foot{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;
             background:var(--card2);border-radius:0 0 14px 14px}
.f{margin-bottom:15px}
.f>label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.f .hint b{color:var(--acc-hi)}
.f .err{font-size:12.5px;color:var(--red);margin-top:5px}
.body>.err{font-size:13px;color:var(--red);border-left:3px solid var(--red);padding-left:9px}
.row2{display:flex;gap:12px}
.row2>*{flex:1}
.seg{display:flex;border:1px solid var(--rule2);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px 4px;font-size:13.5px;font-weight:600;
            color:var(--ink2);border-right:1px solid var(--rule2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--card2)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#fff}
.seg button.ent[aria-pressed="true"]{background:var(--green);color:#fff}
.seg button.sal[aria-pressed="true"]{background:var(--red);color:#fff}
.qty{display:flex;align-items:stretch}
.qty button{width:46px;border:1px solid var(--rule2);background:var(--card);font-size:19px;color:var(--acc)}
.qty button:hover{background:var(--acc-soft)}
.qty button:first-child{border-radius:8px 0 0 8px}
.qty button:last-child{border-radius:0 8px 8px 0}
.qty input{border-radius:0;border-left:0;border-right:0;text-align:center;font-size:19px;font-weight:600}
.cbx{position:relative}
.cbx-list{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--raise);border:1px solid var(--rule2);
          border-radius:0 0 8px 8px;max-height:250px;overflow:auto;box-shadow:0 12px 28px rgba(20,36,58,.14)}
.cbx-list div{padding:8px 11px;border-bottom:1px solid var(--rule);cursor:pointer}
.cbx-list div:hover,.cbx-list div.on{background:var(--acc-soft)}
.cbx-list .c,.picked .c{font-family:var(--mono);font-size:11px;color:var(--acc-hi);display:block}
.cbx-list .d{font-size:13px;color:var(--ink)}
.picked{border:1px solid var(--rule2);border-left:3px solid var(--acc);border-radius:8px;padding:9px 11px;
        background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.picked .d{font-weight:600;color:var(--ink)}
.link{background:none;border:0;color:var(--acc-hi);text-decoration:underline;font-size:12.5px;padding:0}
.link:hover{color:var(--ink)}

/* ---------- datos ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.panel h3{font-size:15px;font-weight:700;margin:0 0 8px;color:var(--ink)}
.panel p{margin:0 0 14px;color:var(--ink2);font-size:13.5px;line-height:1.6}
.panel ol{margin:0;padding-left:20px;color:var(--ink2);font-size:13.5px;line-height:1.8}
.panel ol b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--tf-nav,#14243a);color:#fff;
       padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 12px 30px rgba(20,36,58,.25)}
.mob-only{display:none}
@media(max-width:760px){
  .wrap{padding:14px 16px 60px}
  .top{padding:0 16px}
  .brand{gap:10px;padding:10px 0}
  .brand img{height:28px}
  .brand .divider{display:none}
  .brand h1{font-size:15px}
  .brand .sub{margin-left:0;width:100%}
  .navrow{margin-left:0;width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-bottom:1px solid var(--rule)}
  .tabs{overflow-x:auto}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{border-bottom:1px solid var(--rule);padding:11px 13px}
  td{border:0;padding:2px 0}
  .num,.stock{text-align:left}
  .acts{text-align:left;margin-top:9px}
  .ic{width:40px;height:36px;margin:0 6px 0 0}
  .mob-only{display:inline;font-size:11px;font-weight:600;color:var(--muted);margin-right:7px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

var S = { arts:[], movs:[], tab:"stock", puedeGestionar:false,
  fStock:{q:"",rubro:"",estado:"activos"},
  fMov:{q:"",tipo:"",desde:"",hasta:""} };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoy(){ var d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function fechaAR(iso){ if(!iso) return ""; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function marcar(txt){ var el=document.getElementById("lastsave");
  if(el) el.textContent = txt || "Conectado a la base de datos"; }

/* op: "mov+" | "mov-lote" | "mov-" | "art-save" | "art-toggle" | "art-delete" */
async function guardar(op,arg){
  marcar("Guardando…");
  try{
    var cuerpo;
    if(op==="mov+") cuerpo={op:"movimiento_crear",movimiento:arg};
    else if(op==="mov-lote") cuerpo={op:"movimientos_crear",movimientos:arg};
    else if(op==="mov-") cuerpo={op:"movimiento_borrar",id:arg};
    else if(op==="art-save") cuerpo={op:"articulo_guardar",articulo:arg};
    else if(op==="art-toggle") cuerpo={op:"articulo_estado",codigo:arg.codigo,activo:arg.activo};
    else if(op==="art-delete") cuerpo={op:"articulo_borrar",codigo:arg};
    else throw new Error("Operación desconocida");
    await apiRepuestos({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)});
    await cargar();
    pintar();
    marcar();
    return true;
  }catch(e){
    marcar("Sin guardar");
    toast("No se pudo guardar: "+((e&&e.message)||e));
    try{ await cargar(); pintar(); }catch(ignorado){}
    return false;
  }
}

async function cargar(){
  var d=await apiRepuestos();
  S.arts=d.arts||[];
  S.movs=d.movs||[];
  S.puedeGestionar=!!d.puede_gestionar;
}

async function refrescar(silencioso){
  try{
    await cargar(); pintar(); marcar();
    if(!silencioso) toast("Datos actualizados");
  }catch(e){ if(!silencioso) toast("No se pudo actualizar: "+((e&&e.message)||e)); }
}

/* ---- cálculos ---- */
function stockDe(cod){
  var t=0; for(var i=0;i<S.movs.length;i++){ var m=S.movs[i];
    if(m.codigo===cod) t += (m.tipo==="Salida" ? -m.cantidad : m.cantidad); }
  return t;
}
/* El último costo conocido de un repuesto: el de la compra más reciente
   que lo traiga. Se valoriza con ese y no con un promedio, porque se
   puede explicar de una frase —"tantos por lo que salió el último"— y
   porque las entradas viejas no tienen costo: promediarlas daría un
   número que parece preciso y no lo es. */
function costoDe(cod){
  var mejor=null;
  for(var i=0;i<S.movs.length;i++){ var m=S.movs[i];
    if(m.codigo!==cod || m.costo==null) continue;
    if(!mejor || m.fecha>mejor.fecha || (m.fecha===mejor.fecha && m.id>mejor.id)) mejor=m; }
  return mejor ? mejor.costo : null;
}
function plata(n){
  return n==null ? "—" : "$ "+Number(n).toLocaleString("es-AR",
    {minimumFractionDigits:2, maximumFractionDigits:2});
}
function mapaStock(){
  var mp={}; S.movs.forEach(m=>{ mp[m.codigo]=(mp[m.codigo]||0)+(m.tipo==="Salida"?-m.cantidad:m.cantidad); });
  return mp;
}
function estado(a,st){
  if(!a.activo) return {t:"Dado de baja",c:"t-baja"};
  if(st<0)      return {t:"Revisar",c:"t-neg"};
  if(st===0)    return {t:"Sin stock",c:"t-cero"};
  if(a.minimo>0 && st<=a.minimo) return {t:"Reponer",c:"t-rep"};
  return {t:"Ok",c:"t-ok"};
}
function art(cod){ return S.arts.find(a=>a.codigo===cod); }

/* La hoja de etiquetas sigue el filtro que se esté mirando: si estás viendo
   un rubro, salen las de ese rubro y no las cuatrocientas. */
function enlaceEtiquetas(){
  var p = new URLSearchParams();
  if(S.fStock.rubro) p.set("rubro", S.fStock.rubro);
  else if(S.fStock.q){
    // Con una búsqueda escrita se imprimen justo los que quedaron a la vista.
    var q = norm(S.fStock.q);
    var cods = S.arts.filter(a=>a.activo && (norm(a.descripcion).includes(q) ||
      norm(a.codigo).includes(q) || norm(a.interno).includes(q)))
      .map(a=>a.codigo);
    if(cods.length && cods.length < S.arts.length) p.set("codigos", cods.join(","));
  }
  var q = p.toString();
  return "/repuestos/etiquetas" + (q ? "?" + q : "");
}

function toast(msg){
  var el=document.getElementById("toast");
  el.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.innerHTML="";},2600);
}

/* =======================================================================
   3. PINTAR
   ======================================================================= */
function pintar(){
  var mp=mapaStock(), act=S.arts.filter(a=>a.activo);
  var unid=0, rep=0, cero=0, plata_=0, sinCosto=0;
  act.forEach(a=>{ var s=mp[a.codigo]||0; if(s>0) unid+=s;
    if(s===0) cero++; else if(a.minimo>0 && s<=a.minimo) rep++;
    /* Lo que vale el estante. Los que no tienen costo cargado se cuentan
       aparte en vez de sumar cero: así el total dice de cuánto sale y no
       se lee como si fuera todo. */
    var c=costoDe(a.codigo);
    if(c==null){ if(s>0) sinCosto++; } else plata_ += c*s; });
  document.getElementById("kpis").innerHTML =
    kpi(act.length,"Repuestos activos")+kpi(unid,"Unidades en stock")+
    kpi(rep,"A reponer")+kpi(cero,"Sin stock")+
    kpi(plata(plata_), sinCosto ? "Valorizado · faltan "+sinCosto : "Valorizado")+
    kpi(S.movs.length,"Movimientos");
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  var v=document.getElementById("view");
  v.classList.toggle("es-ancho", S.tab==="estan");
  v.innerHTML = S.tab==="stock" ? vistaStock(mp) : S.tab==="movs" ? vistaMovs() :
                S.tab==="estan" ? vistaEstanterias(mp) : vistaDatos();
  enganchar();
}
function kpi(n,t){ return '<div class="kpi"><b>'+n+'</b><span>'+t+'</span></div>'; }

/* ---------- vista repuestos ---------- */
function vistaStock(mp){
  var f=S.fStock, q=norm(f.q);
  var rubros=[...new Set(S.arts.map(a=>a.rubro))].sort();
  var lista=S.arts.filter(a=>{
    if(f.estado==="activos" && !a.activo) return false;
    if(f.estado==="baja" && a.activo) return false;
    var st=mp[a.codigo]||0;
    if(f.estado==="cero" && (!a.activo || st!==0)) return false;
    if(f.estado==="rep" && !(a.activo && a.minimo>0 && st<=a.minimo && st>0)) return false;
    if(f.rubro && a.rubro!==f.rubro) return false;
    if(q && !(norm(a.descripcion).includes(q)||norm(a.codigo).includes(q)||norm(a.interno).includes(q)||norm(a.anterior).includes(q))) return false;
    return true;
  }).sort((x,y)=>x.descripcion.localeCompare(y.descripcion,"es"));

  var h='<div class="bar">'+
    '<div class="grow"><input type="text" id="q" placeholder="Buscar por descripción o código" value="'+esc(f.q)+'"></div>'+
    '<select id="frubro" style="width:auto"><option value="">Todos los rubros</option>'+
      rubros.map(r=>'<option '+(f.rubro===r?"selected":"")+'>'+esc(r)+'</option>').join("")+'</select>'+
    '<select id="festado" style="width:auto">'+
      [["activos","Activos"],["rep","A reponer"],["cero","Sin stock"],["baja","Dados de baja"],["todos","Todos"]]
      .map(o=>'<option value="'+o[0]+'" '+(f.estado===o[0]?"selected":"")+'>'+o[1]+'</option>').join("")+'</select>'+
    (S.puedeGestionar?'<button class="btn" data-act="nuevo-art">+ Repuesto nuevo</button>'+
      '<button class="btn ghost" data-act="factura">Cargar factura</button>':'')+
    '<button class="btn ghost" data-act="nuevo-mov">Cargar movimiento</button>'+
    '<a class="btn ghost" href="'+enlaceEtiquetas()+'" target="_blank" rel="noopener">Etiquetas QR</a>'+
    '<span class="count">'+lista.length+' de '+S.arts.length+'</span></div>';

  if(!lista.length) return h+'<div class="card"><div class="empty"><b>Sin resultados</b>Modificar el filtro o cargar un repuesto nuevo.</div></div>';

  h+='<div class="card"><table><thead><tr><th>Código</th><th>Descripción</th><th>Rubro</th>'+
     '<th>Ubicación</th><th class="num">Mín.</th><th class="num">Stock</th><th class="num">Último costo</th>'+
     '<th class="num">Valorizado</th><th>Estado</th><th></th></tr></thead><tbody>';
  lista.forEach(a=>{
    var st=mp[a.codigo]||0, e=estado(a,st), c=costoDe(a.codigo);
    h+='<tr class="'+(a.activo?"":"baja")+'">'+
      '<td class="code">'+esc(a.codigo)+'</td>'+
      '<td class="desc">'+esc(a.descripcion)+'</td>'+
      '<td class="rubro">'+esc(a.rubro)+'</td>'+
      '<td class="rubro"><span class="mob-only">Ubicación</span>'+esc(ubicacionDe(a.codigo)||"—")+'</td>'+
      '<td class="num">'+(a.minimo||"—")+'</td>'+
      '<td class="stock"><span class="mob-only">Stock</span>'+st+'</td>'+
      '<td class="num"><span class="mob-only">Último costo</span>'+plata(c)+'</td>'+
      /* Sin costo conocido queda en raya y no en cero: no saber cuánto
         vale no es que no valga nada. */
      '<td class="num"><span class="mob-only">Valorizado</span>'+(c==null?"—":plata(c*st))+'</td>'+
      '<td><span class="tag '+e.c+'">'+e.t+'</span></td>'+
      '<td class="acts">'+
        (a.activo?'<button class="ic plus" title="Entrada" data-act="mov" data-cod="'+esc(a.codigo)+'" data-tipo="Entrada">+</button>'+
                  '<button class="ic minus" title="Salida" data-act="mov" data-cod="'+esc(a.codigo)+'" data-tipo="Salida">−</button>':'')+
        (S.puedeGestionar?'<button class="ic" title="Editar" data-act="edit-art" data-cod="'+esc(a.codigo)+'">✎</button>'+
        '<button class="ic" title="'+(a.activo?"Dar de baja":"Dar de alta")+'" data-act="toggle-art" data-cod="'+esc(a.codigo)+'">'+(a.activo?"⊘":"↺")+'</button>':'')+
      '</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------- vista movimientos ---------- */
function movsFiltrados(){
  var f=S.fMov, q=norm(f.q);
  return S.movs.filter(m=>{
    if(f.tipo && m.tipo!==f.tipo) return false;
    if(f.desde && m.fecha<f.desde) return false;
    if(f.hasta && m.fecha>f.hasta) return false;
    if(q && !(norm(m.desc).includes(q)||norm(m.codigo).includes(q)||norm(m.patente).includes(q)||norm(m.obs).includes(q))) return false;
    return true;
  }).sort((a,b)=> a.fecha===b.fecha ? (b.ts||0)-(a.ts||0) : (a.fecha<b.fecha?1:-1));
}

  lista.forEach(m=>{

function pintarMov(){
  var a=art(M.cod);
  var sel = a ? '<div class="picked"><div><span class="c">'+esc(a.codigo)+'</span><span class="d">'+esc(a.descripcion)+'</span></div>'+
                '<button class="link" data-act="mov-clear">cambiar</button></div>'
              : '<div class="cbx"><input type="text" id="mv-q" autocomplete="off" placeholder="Indicar el producto o el código" value="'+esc(M.q)+'">'+
                (M.open?listaCbx():"")+'</div>';
  var st = a ? stockDe(a.codigo) : null;
  abrir('<h2>'+(M.tipo==="Salida"?"Salida de repuesto":M.tipo==="Entrada"?"Entrada de repuesto":"Ajuste de stock")+'</h2><div class="body">'+
    '<div class="f"><label>Tipo de movimiento</label><div class="seg">'+
      ['Entrada','Salida','Ajuste'].map(t=>'<button class="'+t.slice(0,3).toLowerCase()+'" data-act="mv-tipo" data-t="'+t+'" aria-pressed="'+(M.tipo===t)+'">'+t+'</button>').join("")+
    '</div></div>'+
    '<div class="f"><label>Producto</label>'+sel+
      (a?'<div class="hint">Stock actual: <b>'+st+'</b> · Rubro: '+esc(a.rubro)+'</div>':'')+'</div>'+
    '<div class="row2">'+
      '<div class="f"><label>Fecha</label><input type="date" id="mv-fecha" value="'+M.fecha+'"></div>'+
      '<div class="f"><label>Cantidad</label><div class="qty">'+
        '<button data-act="mv-menos">−</button><input type="number" id="mv-cant" value="'+M.cant+'" step="1">'+
        '<button data-act="mv-mas">+</button></div></div>'+
    '</div>'+
    (M.tipo==="Entrada"||(M.tipo==="Ajuste"&&M.cant>0)
      ? '<div class="f"><label>Costo unitario (opcional)</label>'+
        '<input type="number" id="mv-costo" min="0" step="0.01" value="'+(M.costo==null?"":M.costo)+'" placeholder="0,00">'+
        '<div class="hint">Lo que salió cada unidad, sin IVA. Con esto el estante '+
        'queda valorizado y se sabe cuánto costó lo que se le puso a cada camión.</div></div>'
      : '')+
    '<div class="f"><label>Patente'+(M.tipo==="Salida"?"":" (opcional)")+'</label>'+
      '<div class="plate-wrap plate"><i></i><input class="plate-in" id="mv-pat" maxlength="9" placeholder="AB123CD" value="'+esc(M.pat)+'"></div>'+
      '<div class="hint">Unidad a la que se destina el repuesto.</div></div>'+
    '<div class="f"><label>Observaciones (opcional)</label><input type="text" id="mv-obs" value="'+esc(M.obs)+'" placeholder="Orden de trabajo, proveedor, remito…"></div>'+
    (M.err?'<div class="err">'+esc(M.err)+'</div>':'')+
    '</div><div class="foot"><button class="btn ghost" data-act="cerrar">Cancelar</button>'+
    '<button class="btn" data-act="mv-guardar">Guardar movimiento</button></div>');
  var f=document.getElementById("mv-q"); if(f && M.open===false && !M.cod) f.focus();
}
function listaCbx(){
  var q=norm(M.q);
  var r=S.arts.filter(a=>a.activo && (!q || norm(a.descripcion).includes(q)||norm(a.codigo).includes(q)||norm(a.interno).includes(q)||norm(a.anterior).includes(q)))
        .sort((x,y)=>x.descripcion.localeCompare(y.descripcion,"es")).slice(0,60);
  if(!r.length) return '<div class="cbx-list"><div style="color:#69737D;cursor:default">Sin coincidencias</div></div>';
  return '<div class="cbx-list">'+r.map(a=>'<div data-act="mv-pick" data-cod="'+esc(a.codigo)+'">'+
    '<span class="c">'+esc(a.codigo)+'</span><span class="d">'+esc(a.descripcion)+'</span></div>').join("")+'</div>';
}
function leerMov(){
  var g=id=>document.getElementById(id);
  if(g("mv-fecha")) M.fecha=g("mv-fecha").value;
  if(g("mv-cant"))  M.cant=parseInt(g("mv-cant").value||"0",10);
  if(g("mv-pat"))   M.pat=g("mv-pat").value.toUpperCase().replace(/\s+/g,"");
  M.costo = g("mv-costo") && g("mv-costo").value!=="" ? Number(g("mv-costo").value) : null;
  if(g("mv-obs"))   M.obs=g("mv-obs").value;
  if(g("mv-q"))     M.q=g("mv-q").value;
}
async function guardarMov(){
  leerMov();
  var a=art(M.cod);
  if(!a){ M.err="Seleccionar un producto de la lista."; return pintarMov(); }
  if(!M.fecha){ M.err="Falta la fecha."; return pintarMov(); }
  if(!M.cant || isNaN(M.cant)){ M.err="La cantidad tiene que ser distinta de cero."; return pintarMov(); }
  if(M.tipo!=="Ajuste" && M.cant<0){ M.err="En entradas y salidas la cantidad va en positivo."; return pintarMov(); }
  if(M.tipo==="Salida" && !M.pat){ M.err="Cargar la patente de la unidad que recibe el repuesto."; return pintarMov(); }
  if(M.tipo==="Salida"){
    var st=stockDe(a.codigo);
    if(M.cant>st && !confirm("El stock de “"+a.descripcion+"” es "+st+" y se está retirando "+M.cant+". ¿Confirma el registro?")) return;
  }
  if(M.costo!=null && (isNaN(M.costo) || M.costo<0)){ M.err="El costo no puede ser negativo."; return pintarMov(); }
  var nuevo={fecha:M.fecha,codigo:a.codigo,patente:M.pat,tipo:M.tipo,cantidad:M.cant,obs:M.obs};
  /* Solo viaja cuando el movimiento suma stock: el backend rechaza un
     costo en una salida, y mandarlo igual sería un error seguro. */
  if(M.costo!=null && (M.tipo==="Entrada"||(M.tipo==="Ajuste"&&M.cant>0))) nuevo.costo_unitario=M.costo;
  var etiqueta=M.tipo+" · "+a.descripcion;
  cerrar();
  if(await guardar("mov+",nuevo)) toast("Movimiento guardado · "+etiqueta);
}

/* ---- factura de compra ----
   El modelo propone y la persona decide. El riesgo real no es que lea mal
   un número: es que cree duplicados —"FILTRO ACEITE", "FILTRO DE ACEITE"
   y "F. ACEITE" como tres artículos— y eso no se arregla después. */
var F = null;
function modalFactura(){
  F = null;
  abrir('<h2>Cargar factura de repuestos</h2><div class="body">'+
    '<div class="f"><label>Foto o PDF de la factura</label>'+
    '<input type="file" id="fc-arch" accept="image/*,application/pdf" multiple>'+
    '<div class="hint">Hasta cuatro hojas. Se lee la factura y se proponen los renglones; nada se carga sin que lo confirmes.</div></div>'+
    '<div id="fc-salida"></div></div>'+
    '<div class="foot"><button class="btn ghost" data-act="cerrar">Cancelar</button>'+
    '<button class="btn" data-act="fc-leer">Leer la factura</button></div>');
}

async function archivosDe(input){
  var files=[...(input&&input.files||[])].slice(0,4);
  return Promise.all(files.map(f=>new Promise(listo=>{
    if(!/^image\//.test(f.type)){
      var fr=new FileReader();
      fr.onload=()=>listo({tipo:f.type,contenido:String(fr.result).split(',')[1],nombre:f.name});
      return fr.readAsDataURL(f);
    }
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{
      var k=Math.min(1,1600/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      listo({tipo:'image/jpeg',contenido:c.toDataURL('image/jpeg',.85).split(',')[1],nombre:f.name});
    };
    img.src=url;
  })));
}

async function leerFactura(){
  var archivos=await archivosDe(document.getElementById("fc-arch"));
  if(!archivos.length) return toast("Elegir la foto o el PDF de la factura.");
  var salida=document.getElementById("fc-salida");
  salida.innerHTML='<div class="hint">Leyendo la factura…</div>';
  try{
    var r=await fetch("/api/factura-repuestos",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"leer",que:"repuestos",archivos})});
    var d=await r.json().catch(()=>({error:"Respuesta ilegible del servidor."}));
    if(!r.ok) throw new Error(d.error||"No se pudo leer la factura.");
    F=d; F.renglones.forEach(x=>{ x.codigo=x.articulo?x.articulo.codigo:""; x.nuevo=false; });
    pintarFactura();
  }catch(e){ salida.innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}

function pintarFactura(){
  var r=F.renglones||[];
  if(!r.length) return document.getElementById("fc-salida").innerHTML=
    '<div class="err">No se reconoció ningún renglón en la factura.</div>';
  var h='';
  if(F.dudas&&F.dudas.length) h+='<div class="err"><b>Lo que no se leyó con seguridad</b><ul>'+
    F.dudas.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
  h+='<div class="row2"><div class="f"><label>Factura</label><input type="text" id="fc-num" value="'+esc(F.factura||"")+'"></div>'+
     '<div class="f"><label>Fecha</label><input type="date" id="fc-fecha" value="'+esc((F.fecha||"").slice(0,10)||hoy())+'"></div></div>'+
     '<div class="f"><label>Proveedor</label><input type="text" id="fc-prov" value="'+esc(F.proveedor||"")+'"></div>';
  h+=r.map(function(x,i){
    var estado = x.omitir ? '<span class="tag t-baja">No entra</span>'
      : x.nuevo ? '<span class="tag t-ent">Se da de alta</span>'
      : x.codigo ? '<span class="tag t-ok">'+esc(x.codigo)+'</span>'
      : '<span class="tag t-neg">Falta elegir</span>';
    var ops = x.articulo ? ''
      : (x.candidatos||[]).map(c=>'<button class="link" data-act="fc-elegir" data-i="'+i+'" data-cod="'+esc(c.codigo)+'">'+
          esc(c.descripcion)+' ('+Math.round(c.parecido*100)+'%)</button>').join(" · ");
    return '<div class="f" style="border-top:1px solid var(--rule);padding-top:10px">'+
      '<label>'+esc(x.descripcion)+' '+estado+'</label>'+
      '<div class="row2"><input type="number" id="fc-cant-'+i+'" value="'+(x.cantidad||1)+'" min="1" step="1" placeholder="Cantidad">'+
      '<input type="number" id="fc-costo-'+i+'" value="'+(x.costo_unitario!=null?x.costo_unitario:"")+'" min="0" step="0.01" placeholder="Costo c/u"></div>'+
      (x.nuevo?'<input type="text" id="fc-cod-'+i+'" value="'+esc(x.codigo||"")+'" placeholder="Código con el que se da de alta">':'')+
      '<div class="hint">'+(ops||(x.articulo?'Reconocido por el código del proveedor.':'No se parece a ninguno del catálogo.'))+
      ' · <button class="link" data-act="fc-nuevo" data-i="'+i+'">darlo de alta como nuevo</button>'+
      ' · <button class="link" data-act="fc-omitir" data-i="'+i+'">'+(x.omitir?"volver a incluir":"no cargarlo")+'</button></div></div>';
  }).join("");
  h+='<div id="fc-err"></div><button class="btn" data-act="fc-guardar" style="margin-top:12px">Cargar al stock</button>';
  document.getElementById("fc-salida").innerHTML=h;
}

async function guardarFactura(){
  var renglones=F.renglones.map(function(x,i){
    var g=id=>document.getElementById(id);
    return {omitir:!!x.omitir, nuevo:!!x.nuevo,
      codigo: x.nuevo ? (g("fc-cod-"+i)||{}).value||"" : x.codigo,
      descripcion: x.descripcion, codigo_proveedor: x.codigo_proveedor,
      cantidad: +(g("fc-cant-"+i)||{}).value||0,
      costo_unitario: (g("fc-costo-"+i)||{}).value||null};
  });
  var falta=renglones.find(x=>!x.omitir&&!String(x.codigo||"").trim());
  if(falta) return document.getElementById("fc-err").innerHTML=
    '<div class="err">«'+esc(falta.descripcion)+'» no tiene repuesto elegido. Elegí uno, dalo de alta como nuevo, o sacalo.</div>';
  try{
    var r=await fetch("/api/factura-repuestos",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"guardar",que:"repuestos",
        factura:document.getElementById("fc-num").value,
        fecha:document.getElementById("fc-fecha").value,
        proveedor:document.getElementById("fc-prov").value, renglones})});
    var d=await r.json().catch(()=>({error:"Respuesta ilegible del servidor."}));
    if(!r.ok) throw new Error(d.error||"No se pudo cargar la factura.");
    cerrar(); await cargar(true);
    toast(d.cargados+" renglones cargados"+(d.nuevos?" · "+d.nuevos+" repuestos nuevos":""));
  }catch(e){ document.getElementById("fc-err").innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}

/* ---- artículo ---- */
function modalArt(cod){
  var a=cod?art(cod):null;
  M = a ? Object.assign({nuevo:false,orig:a.codigo,err:""},a)
        : {nuevo:true,orig:"",codigo:"",descripcion:"",rubro:"",interno:"",anterior:"",minimo:0,activo:true,err:""};
  pintarArt();
}
function pintarArt(){
  var rubros=[...new Set(S.arts.map(a=>a.rubro))].sort();
  abrir('<h2>'+(M.nuevo?"Repuesto nuevo":"Editar repuesto")+'</h2><div class="body">'+
    '<div class="f"><label>Descripción del producto</label><input type="text" id="ar-desc" value="'+esc(M.descripcion)+'" placeholder="Ej.: Filtro de aceite Scania"></div>'+
    '<div class="row2">'+
      '<div class="f"><label>Código</label><input type="text" id="ar-cod" value="'+esc(M.codigo)+'" placeholder="Código de proveedor">'+
        (M.nuevo?'<div class="hint">Es el código con el que vas a cargar los movimientos.</div>':'')+'</div>'+
      '<div class="f"><label>Rubro</label><input type="text" id="ar-rubro" list="lrubros" value="'+esc(M.rubro)+'" placeholder="Mecanica">'+
        '<datalist id="lrubros">'+rubros.map(r=>'<option>'+esc(r)+'</option>').join("")+'</datalist></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div class="f"><label>Cod. interno</label><input type="text" id="ar-int" value="'+esc(M.interno)+'"></div>'+
      '<div class="f"><label>Stock mínimo</label><input type="number" id="ar-min" value="'+(M.minimo||0)+'" min="0"><div class="hint">0 = sin aviso.</div></div>'+
    '</div>'+
    (M.err?'<div class="err">'+esc(M.err)+'</div>':'')+
    '</div><div class="foot">'+
    (!M.nuevo?'<button class="btn ghost" data-act="ar-borrar" style="margin-right:auto;border-color:#A32B21;color:#A32B21">Eliminar</button>':'')+
    '<button class="btn ghost" data-act="cerrar">Cancelar</button>'+
    '<button class="btn" data-act="ar-guardar">Guardar</button></div>');
  var d=document.getElementById("ar-desc"); if(d) d.focus();
}
async function guardarArt(){
  var g=id=>document.getElementById(id).value;
  M.descripcion=g("ar-desc").trim(); M.codigo=g("ar-cod").trim();
  M.rubro=g("ar-rubro").trim()||"Sin rubro"; M.interno=g("ar-int").trim();
  M.minimo=parseInt(g("ar-min")||"0",10)||0;
  if(!M.descripcion){ M.err="Falta la descripción."; return pintarArt(); }
  if(!M.codigo){ M.err="Falta el código."; return pintarArt(); }
  if(S.arts.some(a=>a.codigo===M.codigo && a.codigo!==M.orig)){ M.err="Ya existe un repuesto con el código "+M.codigo+"."; return pintarArt(); }
  var esNuevo=M.nuevo;
  var datos={original:M.orig,codigo:M.codigo,descripcion:M.descripcion,rubro:M.rubro,
             interno:M.interno,minimo:M.minimo};
  cerrar();
  if(await guardar("art-save",datos)) toast(esNuevo?"Repuesto agregado":"Repuesto actualizado");
}
async function borrarArt(){
  var cod=M.orig, usos=S.movs.filter(m=>m.codigo===cod).length;
  if(usos){ alert("Este repuesto tiene "+usos+" movimiento(s) cargados. Debe darse de baja en lugar de eliminarse para conservar el historial."); return; }
  if(!confirm("¿Eliminar “"+M.descripcion+"” del listado?")) return;
  cerrar();
  if(await guardar("art-delete",cod)) toast("Repuesto eliminado");
}

/* =======================================================================
   5. EXPORTAR / IMPORTAR
   ======================================================================= */
function bajar(nombre,texto,tipo){
  var b=new Blob([texto],{type:(tipo||"text/plain")+";charset=utf-8"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},400);
}
function csv(filas){
  return "\uFEFF"+filas.map(f=>f.map(c=>{
    var s=String(c==null?"":c);
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
}
function expStock(){
  var mp=mapaStock();
  var f=[["Codigo","Descripcion","Rubro","Cod. Interno","Stock minimo","Activo","Stock actual","Estado"]];
  S.arts.slice().sort((x,y)=>x.descripcion.localeCompare(y.descripcion,"es")).forEach(a=>{
    var st=mp[a.codigo]||0; f.push([a.codigo,a.descripcion,a.rubro,a.interno,a.minimo,a.activo?"SI":"NO",st,estado(a,st).t]);
  });
  bajar("stock_"+hoy()+".csv",csv(f),"text/csv");
}
function expMovs(){
  var f=[["Fecha","Codigo","Producto","Patente","Tipo","Cantidad","Cant. con signo","Observaciones"]];
  movsFiltrados().forEach(m=>f.push([fechaAR(m.fecha),m.codigo,m.desc,m.patente,m.tipo,Math.abs(m.cantidad),
    m.tipo==="Salida"?-Math.abs(m.cantidad):m.cantidad,m.obs||""]));
  bajar("movimientos_"+hoy()+".csv",csv(f),"text/csv");
}
function expJson(){ bajar("respaldo_repuestos_"+hoy()+".json",JSON.stringify({v:1,arts:S.arts,movs:S.movs}),"application/json"); }

/* =======================================================================
   6. EVENTOS
   ======================================================================= */
function enganchar(){
  var v=document.getElementById("view");
  var q=v.querySelector("#q");
  if(q){ q.oninput=e=>{ S.fStock.q=e.target.value; var p=e.target.selectionStart; pintar();
          var n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); }; }
  var mq=v.querySelector("#mq");
  if(mq){ mq.oninput=e=>{ S.fMov.q=e.target.value; var p=e.target.selectionStart; pintar();
          var n=document.getElementById("mq"); n.focus(); n.setSelectionRange(p,p); }; }
  var bind=(id,fn)=>{ var el=v.querySelector(id); if(el) el.onchange=e=>{ fn(e.target.value); pintar(); }; };
  bind("#frubro", x=>S.fStock.rubro=x); bind("#festado", x=>S.fStock.estado=x);
  bind("#mtipo", x=>S.fMov.tipo=x); bind("#mdesde", x=>S.fMov.desde=x); bind("#mhasta", x=>S.fMov.hasta=x);
}

document.addEventListener("input", e=>{
  if(e.target.id==="mv-q"){ M.q=e.target.value; M.open=true; M.err="";
    var sel=e.target.selectionStart; pintarMov();
    var n=document.getElementById("mv-q"); if(n){ n.focus(); n.setSelectionRange(sel,sel); } }
});
document.addEventListener("click", async e=>{
  var t=e.target.closest("[data-act]"), tab=e.target.closest(".tab");
  if(tab){ S.tab=tab.dataset.tab; return pintar(); }
  if(!t){
    if(e.target.dataset.scrim) return cerrar();
    if(M && M.open){ M.open=false; leerMov(); pintarMov(); }
    return;
  }
  var a=t.dataset.act;
  if(a==="cerrar") return cerrar();
  if(a==="refrescar") return refrescar(false);
  if(a==="nuevo-mov") return modalMov("", "Salida");
  if(a==="mov") return modalMov(t.dataset.cod, t.dataset.tipo);
  if(a==="mv-tipo"){ leerMov(); M.tipo=t.dataset.t; M.err=""; if(M.cant<0&&M.tipo!=="Ajuste") M.cant=Math.abs(M.cant); return pintarMov(); }
  if(a==="mv-pick"){ M.cod=t.dataset.cod; M.open=false; M.err=""; return pintarMov(); }
  if(a==="mov-clear"){ leerMov(); M.cod=""; M.q=""; M.open=true; return pintarMov(); }
  if(a==="mv-mas"||a==="mv-menos"){ leerMov(); M.cant=(M.cant||0)+(a==="mv-mas"?1:-1);
    if(M.tipo!=="Ajuste"&&M.cant<1) M.cant=1; return pintarMov(); }
  if(a==="mv-guardar") return guardarMov();
  if(a==="nuevo-art") return modalArt("");
  if(a==="factura") return modalFactura();
  if(a==="fc-leer") return leerFactura();
  if(a==="fc-guardar") return guardarFactura();
  if(a==="fc-elegir"){ F.renglones[+t.dataset.i].codigo=t.dataset.cod;
    F.renglones[+t.dataset.i].nuevo=false; return pintarFactura(); }
  if(a==="fc-nuevo"){ var r=F.renglones[+t.dataset.i];
    r.nuevo=true; r.codigo=r.codigo_proveedor||""; return pintarFactura(); }
  if(a==="fc-omitir"){ var o=F.renglones[+t.dataset.i];
    o.omitir=!o.omitir; return pintarFactura(); }
  if(a==="edit-art") return modalArt(t.dataset.cod);
  if(a==="ar-guardar") return guardarArt();
  if(a==="ar-borrar") return borrarArt();
  if(a==="toggle-art"){ var x=art(t.dataset.cod);
    if(x.activo && !confirm("¿Dar de baja “"+x.descripcion+"”? Deja de aparecer en los listados pero conserva su historial.")) return;
    var activo=!x.activo;
    if(await guardar("art-toggle",{codigo:x.codigo,activo:activo})) toast(activo?"Repuesto dado de alta":"Repuesto dado de baja");
    return; }
  if(a==="del-mov"){ var m=S.movs.find(z=>String(z.id)===String(t.dataset.id));
    if(!confirm("¿Borrar el movimiento del "+fechaAR(m.fecha)+" de “"+m.desc+"”? El stock se recalcula.")) return;
    if(await guardar("mov-",t.dataset.id)) toast("Movimiento borrado"); return; }
  if(a==="exp-stock") return expStock();
  if(a==="exp-movs") return expMovs();
  if(a==="exp-json") return expJson();
});

/* El código que dejó un QR escaneado: /repuestos/FIL-1234 */
function codigoDeLaUrl(){
  var m = /^\/repuestos\/(.+)$/.exec(location.pathname);
  if(!m) return "";
  var cod = decodeURIComponent(m[1]).replace(/\/$/, "");
  return cod === "etiquetas" ? "" : cod;
}

/* Abre la salida de ese repuesto, que es a lo que se escanea una etiqueta.

function abrirDesdeQR(cod){

  history.replaceState(null, "", "/repuestos");
}

<script>

  /* ---------- botón en la solapa Movimientos ---------- */
  function inyectarBoton() {
    if (S.tab !== "movs") return;

    if (!bar || bar.querySelector('[data-act="ocr"]')) return;

  var pintarOriginal = pintar;
  pintar = function () { pintarOriginal.apply(null, arguments); inyectarBoton(); };
  inyectarBoton();

  /* ---------- modal ---------- */
  function abrirAncho(html) {
    document.getElementById("modal").innerHTML =
      '<div class="scrim" data-scrim="1"><div class="modal ancho">' + html + '</div></div>';
  }
  function cerrarOCR() {
    OCR = null;
    document.getElementById("modal").innerHTML = "";
  }

  function filaVacia() {
    return { fecha: hoy(), codigo: "", prod: "", patente: "", tipo: "Salida", cantidad: 1, obs: "", duda: true };
  }

  function modalOCR() {
    OCR = { paso: "carga", dataUrl: "", b64: "", mime: "", filas: [], err: "", nota: "" };
    pintarOCR();
  }

  function pintarOCR() {
    if (!OCR) return;
    if (OCR.paso === "carga")   return pintarCarga();
    if (OCR.paso === "leyendo") return pintarLeyendo();
    return pintarRevision();
  }

  function pintarCarga() {
    abrirAncho('<h2>Leer planilla</h2><div class="body">' +
      (OCR.dataUrl ? '<img class="shot" src="' + OCR.dataUrl + '" alt="">' : '') +
      '<div class="f"><label>' + (OCR.dataUrl ? 'Cambiar la foto' : 'Foto de la planilla') + '</label>' +
        '<div class="drop" data-act="ocr-pick">' +
          '<b>' + (OCR.dataUrl ? 'Elegir otra' : 'Sacar o elegir foto') + '</b>' +
          '<span>JPG o PNG. Que se lean bien la fecha, el producto, la patente y la cantidad.</span>' +
        '</div>' +
        '<input type="file" id="ocr-file" accept="image/*" capture="environment" style="display:none">' +
      '</div>' +
      (OCR.err ? '<div class="err">' + esc(OCR.err) + '</div>' : '') +
      '<p class="ocrnota">La IA lee la foto y arma los movimientos. Los movimientos <b>siempre</b> deben revisarse y corregirse antes de guardarse.</p>' +
      '</div><div class="foot">' +
      '<button class="btn ghost" data-act="ocr-cerrar">Cancelar</button>' +
      '<button class="btn" data-act="ocr-leer"' + (OCR.b64 ? '' : ' disabled') + '>Leer planilla</button></div>');

    var inp = document.getElementById("ocr-file");
    inp.onchange = function () {
      if (!inp.files || !inp.files[0]) return;
      OCR.err = "";
      achicarImagen(inp.files[0], LADO_MAX).then(function (r) {
        OCR.dataUrl = r.dataUrl; OCR.b64 = r.b64; OCR.mime = r.mime; pintarOCR();
      }).catch(function () {
        OCR.err = "No se pudo abrir la imagen. Debe utilizarse un archivo JPG o PNG."; pintarOCR();
      });
    };
  }

  function pintarLeyendo() {
    abrirAncho('<h2>Leer planilla</h2><div class="body">' +
      (OCR.dataUrl ? '<img class="shot" src="' + OCR.dataUrl + '" alt="">' : '') +
      '<div class="pulso"><i></i>Leyendo la planilla…</div>' +
      '<p class="ocrnota" style="text-align:center">Suele tardar entre 10 y 30 segundos.</p>' +
      '</div><div class="foot"><button class="btn ghost" data-act="ocr-cerrar">Cancelar</button></div>');
  }

  function pintarRevision() {
    var opciones = S.arts.filter(function (a) { return a.activo; })
      .sort(function (x, y) { return x.descripcion.localeCompare(y.descripcion, "es"); })
      .map(function (a) { return '<option value="' + esc(a.codigo + " · " + a.descripcion) + '"></option>'; })
      .join("");

    var dudas = OCR.filas.filter(function (f) { return f.duda; }).length;

    var filas = OCR.filas.map(function (f, i) {
      return '<tr data-i="' + i + '" class="' + (f.duda ? "duda" : "") + '">' +
        '<td style="width:120px"><input type="date" data-k="fecha" value="' + esc(f.fecha) + '"></td>' +
        '<td><input type="text" data-k="prod" list="ocr-arts" value="' + esc(f.prod) + '" placeholder="Seleccionar el repuesto"></td>' +
        '<td style="width:98px"><input type="text" data-k="patente" value="' + esc(f.patente) + '" maxlength="9" style="text-transform:uppercase" placeholder="—"></td>' +
        '<td style="width:106px"><select data-k="tipo">' +
          ["Entrada", "Salida", "Ajuste"].map(function (t) {
            return '<option' + (f.tipo === t ? ' selected' : '') + '>' + t + '</option>';
          }).join("") +
        '</select></td>' +
        '<td style="width:74px"><input type="number" data-k="cantidad" value="' + f.cantidad + '" step="1"></td>' +
        '<td><input type="text" data-k="obs" value="' + esc(f.obs) + '" placeholder="—"></td>' +
        '<td style="width:38px"><button class="ic minus" title="Quitar fila" data-act="ocr-del" data-i="' + i + '">✕</button></td>' +
      '</tr>';
    }).join("");

    abrirAncho('<h2>Revisar lo que leyó</h2><div class="body">' +
      '<datalist id="ocr-arts">' + opciones + '</datalist>' +
      (OCR.nota ? '<p class="ocrnota" style="margin:0 0 12px">' + esc(OCR.nota) + '</p>' : '') +
      (dudas ? '<p class="ocrnota" style="margin:0 0 12px">Las filas <b>resaltadas</b> son las que no pudo emparejar con el listado. Seleccionar el repuesto a mano.</p>' : '') +
      '<div class="ocrscroll"><table class="ocrtab"><thead><tr>' +
        '<th>Fecha</th><th>Repuesto</th><th>Patente</th><th>Tipo</th><th>Cant.</th><th>Observaciones</th><th></th>' +
      '</tr></thead><tbody id="ocr-tbody">' + filas + '</tbody></table></div>' +
      '<div class="bar" style="margin:12px 0 0">' +
        '<button class="btn ghost sm" data-act="ocr-add">+ Agregar fila</button>' +
        '<button class="btn ghost sm" data-act="ocr-otra">Leer otra foto</button>' +
        '<span class="count">' + OCR.filas.length + ' movimiento(s)</span>' +
      '</div>' +
      (OCR.err ? '<div class="err" style="margin-top:10px">' + esc(OCR.err) + '</div>' : '') +
      '</div><div class="foot">' +
      '<button class="btn ghost" data-act="ocr-cerrar">Cancelar</button>' +
      '<button class="btn" data-act="ocr-guardar">Guardar ' + OCR.filas.length + ' movimiento(s)</button></div>');
  }

  /* ---------- lectura de la tabla editable ---------- */
  function sincronizar() {
    var trs = document.querySelectorAll("#ocr-tbody tr[data-i]");
    if (!trs.length) return;
    var nuevas = [];
    Array.prototype.forEach.call(trs, function (tr) {
      var g = function (k) { var el = tr.querySelector('[data-k="' + k + '"]'); return el ? el.value : ""; };
      var prod = g("prod");
      var cod = codigoDe(prod);
      nuevas.push({
        fecha: g("fecha"),
        prod: prod,
        codigo: cod,
        patente: g("patente").toUpperCase().replace(/\s+/g, ""),
        tipo: g("tipo"),
        cantidad: parseInt(g("cantidad") || "0", 10),
        obs: g("obs"),
        duda: !cod
      });
    });
    OCR.filas = nuevas;
  }

  function codigoDe(texto) {
    if (!texto) return "";
    var cod = String(texto).split(" · ")[0].trim();
    var a = S.arts.filter(function (x) { return x.codigo.toLowerCase() === cod.toLowerCase(); })[0];
    if (a) return a.codigo;
    var n = norm(texto);
    a = S.arts.filter(function (x) { return norm(x.descripcion) === n; })[0];
    return a ? a.codigo : "";
  }

  /* ---------- imagen ---------- */
  function achicarImagen(file, lado) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height, r = Math.min(1, lado / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.round(w * r); c.height = Math.round(h * r);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL("image/jpeg", 0.82);
          res({ dataUrl: url, b64: url.split(",")[1], mime: "image/jpeg" });
        };
        img.onerror = function () { rej(new Error("imagen")); };
        img.src = fr.result;
      };
      fr.onerror = function () { rej(new Error("archivo")); };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- IA ---------- */
  function leer() {
    if (!OCR.b64) return;
    OCR.paso = "leyendo"; OCR.err = ""; pintarOCR();
    llamarIA(OCR.b64, OCR.mime).then(function (texto) {
      var datos = parsearJSON(texto);
      if (!datos.length) throw new Error("No se encontraron movimientos en la imagen.");
      OCR.filas = datos.map(mapearFila);
      OCR.nota = "Se leyeron " + OCR.filas.length + " movimiento(s). Revisar antes de guardar.";
      OCR.paso = "revision";
      pintarOCR();
    }).catch(function (e) {
      OCR.err = (e && e.message) ? e.message : "No se pudo leer la planilla.";
      OCR.paso = "carga";
      pintarOCR();
    });
  }

  function llamarIA(b64, mime) {
    var catalogo = S.arts.filter(function (a) { return a.activo; })
      .map(function (a) { return a.codigo + " | " + a.descripcion; }).join("\n");

    var instrucciones = [
      "Sos un asistente de depósito. En la imagen hay una planilla de papel con movimientos de repuestos.",
      "",
      "Devolvé SOLO un array JSON. Sin texto antes ni después, sin markdown, sin explicaciones.",
      "",
      "Cada elemento del array tiene estas claves:",
      '  "fecha"       -> "AAAA-MM-DD". Si la planilla escribe dd/mm sin año, usá el año ' + new Date().getFullYear() + '. Si no hay fecha, usá "' + hoy() + '".',
      '  "codigo"      -> el código EXACTO del catálogo de abajo. Si no estás seguro, dejalo "".',
      '  "descripcion" -> el texto del repuesto tal como está escrito en la planilla.',
      '  "patente"     -> patente de la unidad, en mayúsculas y sin espacios. Si no hay, "".',
      '  "tipo"        -> exactamente "Entrada", "Salida" o "Ajuste". Si el repuesto se montó en una unidad o salió del depósito es "Salida". Si entró al depósito o es una compra es "Entrada". Si es un recuento o corrección es "Ajuste". Ante la duda, "Salida".',
      '  "cantidad"    -> número entero positivo. Si no figura, 1.',
      '  "obs"         -> orden de trabajo, remito, proveedor o cualquier nota. Si no hay, "".',
      "",
      "Reglas:",
      "- Una fila de la planilla = un elemento del array.",
      "- No inventes filas ni completes datos que no estén en la imagen.",
      "- Si una fila está tachada o anulada, no la incluyas.",
      "- Emparejá cada renglón con el catálogo aunque esté abreviado o mal escrito. Si ninguna opción encaja con seguridad, dejá codigo en \"\" y copiá el texto en descripcion.",
      "",
      "CATÁLOGO (codigo | descripcion):",
      catalogo
    ].join("\n");

    var body = {
      model: MODELO,
      max_tokens: 4000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mime, data: b64 } },
          { type: "text", text: instrucciones }
        ]
      }]
    };

    return apiRepuestos({
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({op:"vision",body:body})
    }).then(function (d) { return d.texto || ""; });
  }

  function parsearJSON(texto) {
    var t = String(texto || "").replace(/```json/gi, "").replace(/```/g, "").trim();
    var i = t.indexOf("["), j = t.lastIndexOf("]");
    if (i < 0 || j < 0) throw new Error("La IA no devolvió una lista de movimientos.");
    var arr = JSON.parse(t.slice(i, j + 1));
    return Array.isArray(arr) ? arr : [];
  }

  function mapearFila(d) {
    var cod = "";
    if (d.codigo) {
      var a = S.arts.filter(function (x) {
        return x.codigo.toLowerCase() === String(d.codigo).trim().toLowerCase();
      })[0];
      if (a) cod = a.codigo;
    }
    if (!cod && d.descripcion) {
      var n = norm(d.descripcion);
      var m = S.arts.filter(function (x) { return norm(x.descripcion) === n; })[0]
           || (n.length > 4 ? S.arts.filter(function (x) { return norm(x.descripcion).indexOf(n) === 0; })[0] : null)
           || (n.length > 4 ? S.arts.filter(function (x) { return n.indexOf(norm(x.descripcion)) === 0; })[0] : null);
      if (m) cod = m.codigo;
    }
    var a0 = cod ? art(cod) : null;
    var tipo = ["Entrada", "Salida", "Ajuste"].indexOf(d.tipo) >= 0 ? d.tipo : "Salida";
    var cant = parseInt(d.cantidad, 10); if (isNaN(cant) || cant === 0) cant = 1;
    var fec = /^\d{4}-\d{2}-\d{2}$/.test(d.fecha || "") ? d.fecha : hoy();
    return {
      fecha: fec,
      codigo: cod,
      prod: a0 ? (a0.codigo + " · " + a0.descripcion) : (d.descripcion || ""),
      patente: String(d.patente || "").toUpperCase().replace(/\s+/g, ""),
      tipo: tipo,
      cantidad: Math.abs(cant),
      obs: d.obs || "",
      duda: !cod
    };
  }

  /* ---------- guardado ---------- */
  function guardarTodo() {
    sincronizar();
    if (!OCR.filas.length) { OCR.err = "No hay nada para guardar."; return pintarOCR(); }

    for (var i = 0; i < OCR.filas.length; i++) {
      var f = OCR.filas[i], n = i + 1;
      if (!f.codigo)  { OCR.err = "Fila " + n + ": seleccionar el repuesto de la lista."; return pintarOCR(); }
      if (!f.fecha)   { OCR.err = "Fila " + n + ": falta la fecha."; return pintarOCR(); }
      if (!f.cantidad || isNaN(f.cantidad)) { OCR.err = "Fila " + n + ": la cantidad no puede ser cero."; return pintarOCR(); }
      if (f.tipo !== "Ajuste" && f.cantidad < 0) { OCR.err = "Fila " + n + ": en entradas y salidas la cantidad va en positivo."; return pintarOCR(); }
      if (f.tipo === "Salida" && !f.patente) { OCR.err = "Fila " + n + ": falta la patente de la unidad."; return pintarOCR(); }
    }

    var nuevos = OCR.filas.map(function (f) {
      var a = art(f.codigo);
      return {
        id: uid(), ts: Date.now(), fecha: f.fecha, codigo: a.codigo, desc: a.descripcion,
        patente: f.patente, tipo: f.tipo, cantidad: f.cantidad, obs: f.obs
      };
    });

    var cant = nuevos.length;
    cerrarOCR();
    persistir(nuevos).then(function (ok) {
      if(ok) toast(cant + " movimiento(s) guardados desde la planilla");
    });
  }

  function persistir(nuevos) {
    return guardar("mov-lote",nuevos);
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) {
      if (OCR && e.target.dataset && e.target.dataset.scrim) OCR = null;
      return;
    }
    var a = t.dataset.act;
    if (a === "ocr") return modalOCR();
    if (!OCR) return;
    if (a === "ocr-cerrar")  return cerrarOCR();
    if (a === "ocr-pick")    { var i = document.getElementById("ocr-file"); if (i) i.click(); return; }
    if (a === "ocr-leer")    return leer();
    if (a === "ocr-otra")    { OCR.paso = "carga"; OCR.filas = []; OCR.err = ""; return pintarOCR(); }
    if (a === "ocr-add")     { sincronizar(); OCR.filas.push(filaVacia()); return pintarOCR(); }
    if (a === "ocr-del")     { sincronizar(); OCR.filas.splice(parseInt(t.dataset.i, 10), 1); return pintarOCR(); }
    if (a === "ocr-guardar") return guardarTodo();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && OCR) OCR = null;
  });

})();
</script>
