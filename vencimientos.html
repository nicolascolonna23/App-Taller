<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vencimientos | Diemar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161a'/%3E%3Crect x='12' y='7' width='8' height='18' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --plane:#08090b; --surface-1:#12161a; --surface-2:#191e23; --surface-3:#20262c;
    --hairline:rgba(255,255,255,.08); --hairline-2:rgba(255,255,255,.14);
    --ink:#edf0f2; --ink-2:#a9b0b8; --ink-muted:#8d959e;
    --brand:#ff7a1a; --brand-soft:rgba(255,122,26,.13);
    --ok:#31bd65; --warn:#f0b429; --bad:#e35d62;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:14px Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  .top{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;
    background:var(--surface-1);border-bottom:1px solid var(--hairline);
    position:sticky;top:0;z-index:10}
  .top img{height:27px}
  .back{color:var(--ink-muted);text-decoration:none;font-size:12px;font-weight:700;
    padding:5px 9px;border:1px solid var(--hairline-2);border-radius:8px}
  .back:hover{color:var(--brand);border-color:rgba(255,122,26,.4)}
  .brand{font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--ink-muted);font-weight:800}
  .who{margin-left:auto;color:var(--ink-muted);font-size:12px}
  .who a{color:var(--ink-muted);margin-left:10px;text-decoration:none}

  main{max-width:1320px;margin:auto;padding:20px}
  h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
  .sub{color:var(--ink-muted);margin:5px 0 18px}

  .tarjetas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .tarjeta{background:var(--surface-1);border:1px solid var(--hairline);
    border-radius:13px;padding:15px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tarjeta:hover{border-color:var(--hairline-2)}
  .tarjeta.on{border-color:var(--brand);background:var(--brand-soft)}
  .tarjeta b{display:block;font-size:26px;line-height:1.1}
  .tarjeta span{color:var(--ink-muted);font-size:10px;text-transform:uppercase;
    letter-spacing:.9px;font-weight:700}
  .tarjeta.vencido b{color:var(--bad)}
  .tarjeta.por_vencer b{color:var(--warn)}
  .tarjeta.vigente b{color:var(--ok)}

  .barra{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  input,select,textarea{background:var(--surface-2);color:var(--ink);
    border:1px solid var(--hairline-2);border-radius:10px;padding:10px 12px;
    font:inherit;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:rgba(255,122,26,.6)}
  .barra input{max-width:330px}
  .barra select{max-width:210px}
  .btn{border:0;border-radius:10px;background:var(--brand);color:#fff;
    padding:10px 15px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
  .btn.alt{background:var(--surface-3);border:1px solid var(--hairline-2);color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}
  .espacio{margin-left:auto}

  .caja{background:var(--surface-1);border:1px solid var(--hairline);
    border-radius:14px;padding:15px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--ink-muted);font-size:10px;text-transform:uppercase;
    letter-spacing:.8px;padding:10px 8px;border-bottom:1px solid var(--hairline-2);
    white-space:nowrap}
  td{padding:11px 8px;border-bottom:1px solid var(--hairline);vertical-align:top}
  tbody tr:hover{background:rgba(255,122,26,.06)}
  .de{font-weight:800;letter-spacing:.4px}
  .chico{color:var(--ink-muted);font-size:11.5px}
  .marca{display:inline-block;border-radius:99px;padding:4px 9px;font-size:10.5px;
    font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .marca.vencido{color:var(--bad);background:rgba(227,93,98,.13)}
  .marca.por_vencer{color:var(--warn);background:rgba(240,180,41,.13)}
  .marca.vigente{color:var(--ok);background:rgba(49,189,101,.12)}
  .accion{border:0;background:none;color:var(--ink-muted);cursor:pointer;font:inherit;
    font-size:12px;text-decoration:underline;padding:0}
  .accion:hover{color:var(--brand)}
  .vacio{text-align:center;color:var(--ink-muted);padding:34px}

  .fondo{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:30;
    display:none;align-items:center;justify-content:center;padding:18px}
  .fondo.on{display:flex}
  .modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface-1);
    border:1px solid var(--hairline-2);border-radius:16px;padding:20px}
  .modal h2{margin:0;font-size:19px}
  .cerrar{border:0;background:none;color:var(--ink-muted);font-size:25px;cursor:pointer}
  .cabecera{display:flex;justify-content:space-between;align-items:center}
  .campos{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:14px}
  label{display:block;color:var(--ink-muted);font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .ancho{grid-column:1/-1}
  .aviso{margin-top:12px;padding:11px;border-radius:10px;font-size:13px}
  .aviso.mal{color:#ffb3b6;background:rgba(227,93,98,.12)}
  .aviso.bien{color:#a7e8bc;background:rgba(49,189,101,.12)}
  .pista{color:var(--ink-muted);font-size:12px;margin-top:9px}

  @media(max-width:820px){
    .tarjetas{grid-template-columns:repeat(2,1fr)}
    main{padding:13px}
    .barra input,.barra select{max-width:none}
    .campos{grid-template-columns:1fr}
    th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}
  }
</style>
</head>
<body>

<header class="top">
  <img src="/logo.png" alt="Diemar" onerror="this.style.display='none'">
  <a class="back" href="/">‹ Inicio</a>
  <span class="brand">Vencimientos</span>
  <span class="who" id="quien"></span>
</header>

<main>
  <h1>Vencimientos</h1>
  <p class="sub" id="pie">Cargando…</p>

  <div class="tarjetas">
    <button class="tarjeta vencido"    data-filtro="vencido"><b id="n-vencido">–</b><span>Vencidos</span></button>
    <button class="tarjeta por_vencer" data-filtro="por_vencer"><b id="n-por_vencer">–</b><span>Por vencer</span></button>
    <button class="tarjeta vigente"    data-filtro="vigente"><b id="n-vigente">–</b><span>Al día</span></button>
    <button class="tarjeta"            data-filtro="faltante"><b id="n-faltante">–</b><span>Sin cargar</span></button>
  </div>

  <div class="barra">
    <input id="buscar" placeholder="Buscar patente, interno, persona o número">
    <select id="filtroTipo"><option value="">Todos los tipos</option></select>
    <button class="btn espacio" id="nuevo">+ Cargar vencimiento</button>
  </div>

  <div class="caja">
    <table>
      <thead><tr>
        <th>Qué</th><th>De quién</th><th>Número</th><th>Detalle</th>
        <th>Vence</th><th>Dónde</th><th>Estado</th><th></th>
      </tr></thead>
      <tbody id="filas"><tr><td colspan="8" class="vacio">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>

<div class="fondo" id="modalCarga"><div class="modal">
  <div class="cabecera"><h2 id="tituloCarga">Cargar vencimiento</h2>
    <button class="cerrar" data-cerrar="modalCarga">×</button></div>
  <div class="campos">
    <div class="ancho"><label>Qué vence</label><select id="cTipo"></select></div>
    <div class="ancho" id="cajaUnidad"><label>Unidad</label><select id="cUnidad"></select></div>
    <div class="ancho" id="cajaPersona"><label>Persona</label>
      <select id="cPersona"></select>
      <p class="pista">¿No está? <button class="accion" id="nuevaPersona">Agregar una persona</button></p>
    </div>
    <div><label>Número <span id="numObl"></span></label><input id="cNumero" placeholder="Oblea, licencia, matafuego"></div>
    <div><label>Detalle</label><input id="cDetalle" placeholder="Clase E1, 5 kg ABC, aseguradora"></div>
    <div><label>Emisión</label><input id="cDesde" type="date"></div>
    <div><label>Vence</label><input id="cVence" type="date"></div>
    <div><label>Dónde</label><input id="cDonde" placeholder="Planta, taller, aseguradora"></div>
    <div><label>Costo</label><input id="cCosto" type="number" min="0" step="0.01"></div>
    <div class="ancho"><label>Observaciones</label><input id="cObs"></div>
  </div>
  <div id="avisoCarga"></div>
  <p class="pista" id="pistaVence"></p>
  <div class="barra" style="margin:14px 0 0">
    <button class="btn" id="guardar">Guardar</button>
    <button class="btn alt" data-cerrar="modalCarga">Cancelar</button>
  </div>
</div></div>

<div class="fondo" id="modalPersona"><div class="modal">
  <div class="cabecera"><h2>Agregar persona</h2>
    <button class="cerrar" data-cerrar="modalPersona">×</button></div>
  <div class="campos">
    <div class="ancho"><label>Nombre y apellido</label><input id="pNombre"></div>
    <div><label>Documento</label><input id="pDoc"></div>
    <div><label>Legajo</label><input id="pLegajo"></div>
    <div><label>Sucursal</label><input id="pSucursal"></div>
    <div><label>Teléfono</label><input id="pTel"></div>
  </div>
  <div id="avisoPersona"></div>
  <div class="barra" style="margin:14px 0 0">
    <button class="btn" id="guardarPersona">Guardar</button>
    <button class="btn alt" data-cerrar="modalPersona">Cancelar</button>
  </div>
</div></div>

<div class="fondo" id="modalHist"><div class="modal">
  <div class="cabecera"><h2 id="tituloHist">Historial</h2>
    <button class="cerrar" data-cerrar="modalHist">×</button></div>
  <div id="cuerpoHist"></div>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = { datos:null, filtro:'', usuario:null };

async function api(op, extra) {
  const r = await fetch('/api/vencimientos', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({op}, extra || {}))});
  const d = await r.json().catch(() => ({error:'Respuesta ilegible del servidor.'}));
  if (!r.ok) throw new Error(d.error || 'No se pudo completar.');
  return d;
}

/** AD247MQ -> AD 247 MQ, como lo lee una persona. */
function pat(p) {
  const m = /^([A-Z]{2})(\d{3})([A-Z]{2})$/.exec(p || '');
  if (m) return `${m[1]} ${m[2]} ${m[3]}`;
  const o = /^([A-Z]{3})(\d{3})$/.exec(p || '');
  return o ? `${o[1]} ${o[2]}` : (p || '');
}
const fecha = f => !f ? '' : String(f).slice(0,10).split('-').reverse().join('/');

function cuantoFalta(dias) {
  if (dias < 0)  return `hace ${-dias} día${dias === -1 ? '' : 's'}`;
  if (dias === 0) return 'hoy';
  if (dias === 1) return 'mañana';
  return `en ${dias} días`;
}

// ---------------------------------------------------------------- pintar
function pintar() {
  const d = D.datos;
  for (const k of ['vencido','por_vencer','vigente'])
    $('#n-' + k).textContent = d.resumen[k] || 0;
  $('#n-faltante').textContent = d.faltantes.length;

  document.querySelectorAll('.tarjeta').forEach(t =>
    t.classList.toggle('on', t.dataset.filtro === D.filtro));

  const busca = $('#buscar').value.trim().toLowerCase();
  const tipo  = $('#filtroTipo').value;

  if (D.filtro === 'faltante') return pintarFaltantes(busca, tipo);

  const filas = d.vencimientos.filter(v =>
    (!D.filtro || v.estado === D.filtro) &&
    (!tipo || String(v.tipo_id) === tipo) &&
    (!busca || [v.patente, v.interno, v.persona, v.identificador, v.detalle, v.tipo]
       .some(x => String(x || '').toLowerCase().includes(busca))));

  $('#filas').innerHTML = filas.length ? filas.map(v => `
    <tr>
      <td>${esc(v.tipo)}</td>
      <td><span class="de">${esc(v.patente ? pat(v.patente) : v.persona)}</span>
          ${v.interno ? `<div class="chico">int. ${esc(v.interno)}</div>` : ''}
          ${v.sucursal ? `<div class="chico">${esc(v.sucursal)}</div>` : ''}</td>
      <td class="chico">${esc(v.identificador || '')}</td>
      <td class="chico">${esc(v.detalle || '')}</td>
      <td>${fecha(v.vence)}<div class="chico">${esc(cuantoFalta(v.dias))}</div></td>
      <td class="chico">${esc(v.donde || '')}</td>
      <td><span class="marca ${v.estado}">${v.estado === 'por_vencer' ? 'por vencer' : v.estado}</span></td>
      <td><button class="accion" data-renovar="${v.id}">Renovar</button>
          <div><button class="accion" data-hist="${v.id}">Historial</button></div></td>
    </tr>`).join('')
    : `<tr><td colspan="8" class="vacio">No hay nada acá.</td></tr>`;

  $('#pie').textContent = `${filas.length} de ${d.vencimientos.length} vencimientos cargados.`;
}

function pintarFaltantes(busca, tipo) {
  const filas = D.datos.faltantes.filter(f =>
    (!tipo || String(f.tipo_id) === tipo) &&
    (!busca || [f.patente, f.interno, f.persona, f.tipo]
       .some(x => String(x || '').toLowerCase().includes(busca))));

  $('#filas').innerHTML = filas.length ? filas.map(f => `
    <tr>
      <td>${esc(f.tipo)}</td>
      <td><span class="de">${esc(f.patente ? pat(f.patente) : f.persona)}</span>
          ${f.interno ? `<div class="chico">int. ${esc(f.interno)}</div>` : ''}</td>
      <td colspan="4" class="chico">Todavía no se cargó ninguno.</td>
      <td><span class="marca vencido">sin cargar</span></td>
      <td><button class="accion" data-cargar="${f.tipo_id}"
            data-unidad="${f.unidad_id || ''}" data-persona="${f.persona_id || ''}">Cargar</button></td>
    </tr>`).join('')
    : `<tr><td colspan="8" class="vacio">No falta cargar nada.</td></tr>`;

  $('#pie').textContent = `${filas.length} sin cargar.`;
}

// ------------------------------------------------------------ formulario
function opciones() {
  $('#filtroTipo').innerHTML = '<option value="">Todos los tipos</option>' +
    D.datos.tipos.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('');
  $('#cTipo').innerHTML = D.datos.tipos
    .map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('');
  $('#cUnidad').innerHTML = '<option value="">Elegir patente</option>' + D.datos.unidades
    .map(u => `<option value="${u.id}">${esc(pat(u.patente))}${u.interno ? ' · int. ' + esc(u.interno) : ''}</option>`).join('');
  $('#cPersona').innerHTML = '<option value="">Elegir persona</option>' + D.datos.personas
    .map(p => `<option value="${p.id}">${esc(p.nombre)}${p.documento ? ' · ' + esc(p.documento) : ''}</option>`).join('');
}

function tipoElegido() {
  return D.datos.tipos.find(t => String(t.id) === $('#cTipo').value);
}

function acomodarFormulario() {
  const t = tipoElegido();
  if (!t) return;
  $('#cajaUnidad').style.display  = t.ambito === 'unidad'  ? '' : 'none';
  $('#cajaPersona').style.display = t.ambito === 'persona' ? '' : 'none';
  $('#numObl').textContent = t.varios ? '(obligatorio)' : '';
  $('#pistaVence').textContent = t.meses
    ? `Si ponés la emisión y dejás el vencimiento vacío, se calcula a ${t.meses} meses.`
    : 'Poné la fecha de vencimiento.';
}

function abrir(id, previo) {
  $('#avisoCarga').innerHTML = '';
  ['cNumero','cDetalle','cDesde','cVence','cDonde','cCosto','cObs']
    .forEach(c => $('#' + c).value = '');
  if (previo) {
    $('#cTipo').value = previo.tipo_id;
    if (previo.unidad_id)  $('#cUnidad').value  = previo.unidad_id;
    if (previo.persona_id) $('#cPersona').value = previo.persona_id;
    if (previo.identificador) $('#cNumero').value = previo.identificador;
    if (previo.detalle) $('#cDetalle').value = previo.detalle;
    if (previo.donde)   $('#cDonde').value   = previo.donde;
  }
  $('#tituloCarga').textContent = previo && previo.identificador !== undefined && previo.vence
    ? 'Renovar vencimiento' : 'Cargar vencimiento';
  acomodarFormulario();
  $(id).classList.add('on');
}

async function guardar() {
  const t = tipoElegido();
  const cuerpo = {
    tipo_id: Number($('#cTipo').value),
    unidad_id:  t.ambito === 'unidad'  ? Number($('#cUnidad').value)  || null : null,
    persona_id: t.ambito === 'persona' ? Number($('#cPersona').value) || null : null,
    identificador: $('#cNumero').value, detalle: $('#cDetalle').value,
    desde: $('#cDesde').value || null, vence: $('#cVence').value || null,
    donde: $('#cDonde').value, costo: $('#cCosto').value || null,
    observaciones: $('#cObs').value,
  };
  $('#guardar').disabled = true;
  try {
    const r = await api('guardar', cuerpo);
    $('#modalCarga').classList.remove('on');
    await cargar();
    D.filtro = '';
    $('#buscar').value = cuerpo.identificador || '';
    pintar();
    void r;
  } catch (e) {
    $('#avisoCarga').innerHTML = `<div class="aviso mal">${esc(e.message)}</div>`;
  } finally {
    $('#guardar').disabled = false;
  }
}

// ----------------------------------------------------------------- inicio
async function cargar() {
  const r = await fetch('/api/vencimientos');
  if (!r.ok) throw new Error('No se pudieron leer los vencimientos.');
  D.datos = await r.json();
  opciones();
}

document.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.dataset.cerrar) $('#' + t.dataset.cerrar).classList.remove('on');
  if (t.classList.contains('tarjeta') || t.closest('.tarjeta')) {
    const b = t.closest('.tarjeta');
    D.filtro = D.filtro === b.dataset.filtro ? '' : b.dataset.filtro;
    pintar();
  }
  if (t.dataset.renovar) {
    const v = D.datos.vencimientos.find(x => String(x.id) === t.dataset.renovar);
    abrir('#modalCarga', v);
  }
  if (t.dataset.cargar) {
    abrir('#modalCarga', {tipo_id: Number(t.dataset.cargar),
      unidad_id: Number(t.dataset.unidad) || null,
      persona_id: Number(t.dataset.persona) || null});
  }
  if (t.dataset.hist) {
    const v = D.datos.vencimientos.find(x => String(x.id) === t.dataset.hist);
    $('#tituloHist').textContent = `${v.tipo} · ${v.patente ? pat(v.patente) : v.persona}`;
    $('#cuerpoHist').innerHTML = '<p class="pista">Buscando…</p>';
    $('#modalHist').classList.add('on');
    try {
      const {historial} = await api('historial', {tipo_id: v.tipo_id,
        unidad_id: v.unidad_id, persona_id: v.persona_id,
        identificador: v.identificador});
      $('#cuerpoHist').innerHTML = historial.length ? `<table><thead><tr>
          <th>Vence</th><th>Emitido</th><th>Número</th><th>Dónde</th><th>Cargó</th></tr></thead>
        <tbody>${historial.map(h => `<tr>
          <td>${fecha(h.vence)}</td><td class="chico">${fecha(h.desde)}</td>
          <td class="chico">${esc(h.identificador || '')}</td>
          <td class="chico">${esc(h.donde || '')}</td>
          <td class="chico">${esc(h.usuario || '')}</td></tr>`).join('')}</tbody></table>`
        : '<p class="vacio">Sin historial.</p>';
    } catch (e) {
      $('#cuerpoHist').innerHTML = `<div class="aviso mal">${esc(e.message)}</div>`;
    }
  }
});

$('#nuevo').onclick = () => abrir('#modalCarga', null);
$('#cTipo').onchange = acomodarFormulario;
$('#guardar').onclick = guardar;
$('#buscar').oninput = pintar;
$('#filtroTipo').onchange = pintar;
$('#nuevaPersona').onclick = () => { $('#avisoPersona').innerHTML = ''; $('#modalPersona').classList.add('on'); };
$('#guardarPersona').onclick = async () => {
  try {
    await api('persona', {nombre: $('#pNombre').value, documento: $('#pDoc').value,
      legajo: $('#pLegajo').value, sucursal: $('#pSucursal').value, telefono: $('#pTel').value});
    $('#modalPersona').classList.remove('on');
    ['pNombre','pDoc','pLegajo','pSucursal','pTel'].forEach(c => $('#' + c).value = '');
    await cargar();
    $('#cPersona').value = D.datos.personas[D.datos.personas.length - 1].id;
  } catch (e) {
    $('#avisoPersona').innerHTML = `<div class="aviso mal">${esc(e.message)}</div>`;
  }
};

(async function () {
  try {
    D.usuario = await (await fetch('/api/yo')).json();
    $('#quien').innerHTML = `${esc(D.usuario.nombre)} <a href="/salir">Salir</a>`;
    if (!D.usuario.puede_administrar) $('#nuevo').style.display = 'none';
  } catch (e) { void e; }
  try {
    await cargar();
    pintar();
  } catch (e) {
    $('#filas').innerHTML = `<tr><td colspan="8" class="vacio">${esc(e.message)}</td></tr>`;
    $('#pie').textContent = '';
  }
})();
</script>
</body>
</html>
